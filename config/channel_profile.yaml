channel:
  name: "The Office Music"
  concept: "premium fashion-retail, office and home-office music"

generation:
  model: "medium"
  tracks_per_batch: 10
  track_duration_seconds: 360
  steps: 8
  cfg_scale: 1.0
  chunked_decode: true
  pure_text_to_audio: true

music_dna:
  instrumental_only: true
  energy: 6
  bpm_min: 120
  bpm_max: 123
  groove: "steady four-on-the-floor fashion-retail house groove, confident, smooth, lightly syncopated, hypnotic and commercial without becoming aggressive"
  mood:
    - "stylish"
    - "modern"
    - "confident"
    - "premium"
    - "focused"
  style_pool:
    - "modern fashion-retail deep house with polished commercial chill-house production"
    - "premium lounge house with a catchy minimalist dance-pop pulse"
    - "clean commercial deep house for fashion stores and modern offices"
  preferred_instruments:
    - "rounded sidechained synth bass"
    - "clean punchy four-on-the-floor house kick"
    - "crisp closed hi-hats and tasteful claps"
    - "minimal bright synth plucks"
    - "warm atmospheric pads"
    - "subtle electric keys"
    - "short tasteful electronic percussion accents"
  avoid_instruments:
    - "distorted guitars"
    - "cinematic orchestral elements"
    - "festival EDM supersaws"
    - "hard techno drums"
    - "trap percussion"
  percussion: "clean four-on-the-floor kick, controlled hi-hats, subtle claps and percussion, danceable fashion-store pulse, no aggressive fills"
  bass: "warm rounded deep-house bassline with gentle sidechain movement, present, catchy and rhythmic without overpowering the mix"
  melody_density: "medium-low, one memorable minimalist hook with tasteful repetition and gradual variation"
  brightness: "polished and modern, slightly glossy top end, warm low mids"
  arrangement: "six-minute continuous retail-friendly arrangement with smooth evolution, restrained breakdowns, no huge drops, no abrupt genre changes, consistent groove from start to finish"
  production: "premium contemporary fashion-store sound, clean stereo image, tight low end, polished commercial mix, sophisticated lounge atmosphere suitable for office and home-office listening"

negative_prompt:
  - "poor quality"
  - "distortion"
  - "clipping"
  - "harsh treble"
  - "festival EDM"
  - "hard techno"
  - "trap"
  - "dramatic cinematic trailer music"
  - "intelligible vocals"
  - "spoken words"
  - "rap"
  - "choir"
  - "crowd noise"

output:
  format: "wav"
  sample_rate: 44100
  directory: "/kaggle/working/output"
  write_manifest: true
