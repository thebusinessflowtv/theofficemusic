channel:
  name: "The Office Music"
  concept: "instrumental music for office, home office, retail and focused work"

# Este arquivo será calibrado antes da primeira geração oficial.
generation:
  model: "medium"
  tracks_per_batch: 5
  track_duration_seconds: 330
  steps: 8
  cfg_scale: 1.0
  chunked_decode: true
  pure_text_to_audio: true

music_dna:
  instrumental_only: true
  energy: 5            # 1 = muito calma | 10 = muito energética
  bpm_min: 100
  bpm_max: 118
  groove: "smooth, steady, refined"
  mood:
    - "sophisticated"
    - "modern"
    - "focused"
    - "warm"
  style_pool:
    - "modern chill house"
    - "downtempo electronic"
    - "lounge house"
    - "minimal deep house"
  preferred_instruments:
    - "warm electric piano"
    - "soft analog synths"
    - "rounded synth bass"
    - "clean electronic drums"
    - "subtle guitar textures"
  avoid_instruments:
    - "aggressive distorted guitars"
    - "brass fanfares"
    - "cinematic orchestral percussion"
  percussion: "clean, tasteful, controlled, danceable without sounding like a club peak-time track"
  bass: "warm, rounded, present but not overpowering"
  melody_density: "medium-low"
  brightness: "balanced and polished"
  arrangement: "gradual evolution, no abrupt drops, suitable for continuous background listening"
  production: "premium retail lounge production, clean stereo image, warm and polished mix"

negative_prompt:
  - "poor quality"
  - "distortion"
  - "clipping"
  - "harsh treble"
  - "aggressive festival EDM"
  - "hard techno"
  - "trap hi-hat rolls"
  - "dramatic cinematic trailer"
  - "intelligible vocals"
  - "spoken words"
  - "rap"
  - "choir"
  - "crowd noise"

output:
  format: "wav"
  sample_rate: 44100
  directory: "/kaggle/working/output"
  write_manifest: true
