name: Peter Lofi — Bridge Private UI Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-ui-test-bridge.yml"

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Reload host agent and bridge isolated UI-test command locally
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://mediaforge-api.guilhermeodsgn.workers.dev"
          curl -fsS -X POST "$BASE/api/ops/20261003-live-stability/host-agent?v=10&id=ops-ui-test-bridge-v3" | tee /tmp/request.json
          for I in $(seq 1 80); do
            curl -fsS "$BASE/api/ops/20261003-live-stability/status" > /tmp/status.json
            ST="$(jq -r '[.commands[]? | select(.action=="deploy_host_agent")] | sort_by(.created_at) | last | .status // empty' /tmp/status.json)"
            echo "deploy_host_agent=$ST"
            [ "$ST" = "completed" ] && break
            [ "$ST" = "failed" ] && { cat /tmp/status.json; exit 1; }
            sleep 3
          done
          [ "$ST" = "completed" ]
          sleep 15
