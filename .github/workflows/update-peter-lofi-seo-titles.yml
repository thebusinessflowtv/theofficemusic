name: Peter Lofi — SEO Titles

on:
  push:
    paths:
      - '.github/workflows/update-peter-lofi-seo-titles.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install YouTube runtime
        run: python -m pip install google-api-python-client google-auth google-auth-httplib2
      - name: Update live and future-video titles
        run: python scripts/update_peter_lofi_seo_titles.py
