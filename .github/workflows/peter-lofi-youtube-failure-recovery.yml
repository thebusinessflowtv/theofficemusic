name: Peter Lofi — YouTube Failure Recovery

on:
  workflow_run:
    workflows:
      - "Office Music — Live"
      - "One-off — Recover Deep House YouTube Live"
      - "One-off — Recreate Rainy YouTube Live"
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: peter-lofi-youtube-24x7-watchdog
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Recover station immediately when its current encoder dies
        run: |
          set -euo pipefail
          mkdir -p control/live-watchdog
          python - <<'PY'
          import json, os, pathlib, time, urllib.request
          from datetime import datetime, timezone
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          root=pathlib.Path('.')
          completed=int(os.environ['COMPLETED_RUN_ID'])
          cfg=json.loads((root/'control/youtube-stations.json').read_text(encoding='utf-8'))

          creds=Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube'],
          )
          creds.refresh(Request())
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)

          def state(bid,sid):
              lifecycle=stream_status=privacy=None
              if bid:
                  items=yt.liveBroadcasts().list(part='status',id=bid).execute().get('items') or []
                  if items:
                      st=items[0].get('status') or {}
                      lifecycle=st.get('lifeCycleStatus'); privacy=st.get('privacyStatus')
              if sid:
                  items=yt.liveStreams().list(part='status',id=sid).execute().get('items') or []
                  if items: stream_status=(items[0].get('status') or {}).get('streamStatus')
              return lifecycle,stream_status,privacy

          def dispatch(inputs):
              url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/office-music-live.yml/dispatches"
              req=urllib.request.Request(url,data=json.dumps({'ref':'main','inputs':inputs}).encode(),method='POST',headers={
                  'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'Content-Type':'application/json',
                  'User-Agent':'MediaForge-YouTube-Failure-Recovery',
              })
              with urllib.request.urlopen(req,timeout=30) as r:
                  if r.status not in (200,201,204): raise RuntimeError(f'dispatch HTTP {r.status}')

          for station in cfg.get('stations',[]):
              if not station.get('enabled',True): continue
              session=station['session_id']
              result_path=root/f'control/live-results/{session}.json'
              if not result_path.exists(): continue
              result=json.loads(result_path.read_text(encoding='utf-8'))

              current=int(result.get('github_run_id') or 0)
              if current != completed:
                  print(f"[{station['key']}] completed run {completed} is not current run {current}; successor already owns station.")
                  continue

              bid=str(result.get('youtube_broadcast_id') or '')
              sid=str(result.get('youtube_stream_id') or '')
              try:
                  lifecycle,stream_status,privacy=state(bid,sid)
              except Exception as exc:
                  print(f"[{station['key']}] YouTube verification unavailable; scheduled watchdog will retry: {exc}")
                  continue

              if lifecycle=='live' and stream_status=='active' and privacy=='public':
                  print(f"[{station['key']}] encoder workflow ended but YouTube ingest is still active; no recovery.")
                  continue

              queue=json.loads((root/station['source_queue']).read_text(encoding='utf-8'))
              terminal=lifecycle in ('complete','revoked') or not bid or not sid
              next_seg=str(int(result.get('segment_index') or 0)+1)
              inputs={
                  'session_id':session,
                  'track_urls_b64':str(queue['track_urls_b64']),
                  'duration_minutes':'0',
                  'title':str(queue.get('title') or f"Peter Lofi — {station.get('name',station['key'])}"),
                  'description':str(queue.get('description') or ''),
                  'thumbnail_url':str(queue.get('thumbnail_url') or ''),
                  'loop_url':str(queue.get('loop_url') or ''),
                  'resume_broadcast_id':'' if terminal else bid,
                  'resume_stream_id':'' if terminal else sid,
                  'segment_index':next_seg,
                  'privacy_status':'public',
                  'segment_seconds_override':'0',
                  'prewarm_lead_seconds':'900',
                  'max_segments':'0',
              }
              dispatch(inputs)
              stamp=datetime.now(timezone.utc).isoformat()
              (root/f'control/live-watchdog/{session}.json').write_text(json.dumps({
                  'station':station['key'],
                  'session_id':session,
                  'last_recovery_requested_at':stamp,
                  'trigger':'workflow_run_completed',
                  'completed_run_id':completed,
                  'observed_lifecycle':lifecycle,
                  'observed_stream_status':stream_status,
                  'observed_privacy':privacy,
                  'resume_existing_broadcast':not terminal,
                  'requested_segment_index':int(next_seg),
              },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(f"[{station['key']}] immediate recovery dispatched for segment {next_seg}.")
          PY

      - name: Persist recovery lock
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/live-watchdog
          git diff --cached --quiet && exit 0
          git commit -m "live: immediate failure recovery state"
          git pull --rebase origin main
          git push origin HEAD:main
