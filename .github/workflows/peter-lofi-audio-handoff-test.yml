name: Peter Lofi — Audio Handoff Dry Test

on:
  push:
    paths:
      - 'control/audio-handoff-tests/*.json'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null

      - name: Validate resumed audio offset
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILE="$(git show --pretty='' --name-only "$AFTER_SHA" | grep -E '^control/audio-handoff-tests/[^/]+\.json$' | tail -1)"
          [ -n "$FILE" ] || { echo "No handoff test request found in $AFTER_SHA"; exit 1; }
          SESSION_ID="$(jq -r '.session_id' "$FILE")"
          FALLBACK="$(jq -r '.track_urls_b64' "$FILE")"
          EXPECTED="$(jq -r '.expected_offset' "$FILE")"
          EXPECTED_SOURCE="$(jq -r '.expected_source // "handoff"' "$FILE")"

          set +e
          timeout 8s python scripts/mediaforge_live_audio_feeder.py \
            --session-id "$SESSION_ID" \
            --fallback-b64 "$FALLBACK" \
            --segment-index 2 \
            >/dev/null 2>feeder.log
          RC=$?
          set -e

          cat feeder.log
          [ "$RC" -eq 0 ] || [ "$RC" -eq 124 ]
          grep -q "Resuming segment 2 from ${EXPECTED_SOURCE}" feeder.log
          grep -q "@ ${EXPECTED}s" feeder.log
          echo "Audio handoff resume validated from ${EXPECTED_SOURCE} at ${EXPECTED}s"
