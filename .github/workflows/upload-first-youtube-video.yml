name: Upload First The Office Music Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: "YouTube title"
        required: false
        default: "stylish office beats to work to ☕ | lounge house mix"
      privacy:
        description: "YouTube privacy"
        required: true
        default: "public"
        type: choice
        options:
          - public
          - unlisted
          - private
  push:
    branches:
      - main
    paths:
      - '.github/workflows/upload-first-youtube-video.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: the-office-music-youtube-upload
  cancel-in-progress: false

jobs:
  upload-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg unzip
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Validate YouTube secrets
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          test -n "$YOUTUBE_CHANNEL_ID"

      - name: Prepare loop video and thumbnail
        run: |
          set -euo pipefail
          mkdir -p build
          tr -d '\r\n ' < assets/bootstrap/loop_00.b64 | base64 --decode > build/loop.mp4
          tr -d '\r\n ' < assets/bootstrap/thumb_compact.b64 | base64 --decode > build/thumbnail.jpg
          test -s build/loop.mp4
          test -s build/thumbnail.jpg
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json build/loop.mp4
          file build/thumbnail.jpg

      - name: Download approved generated track
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/thebusinessflowtv/theofficemusic/actions/artifacts/11009873245/zip" \
            -o build/music.zip
          unzip -o build/music.zip -d build/music
          WAV_FILE="$(find build/music -type f -name '*.wav' | head -n 1)"
          test -n "$WAV_FILE"
          cp "$WAV_FILE" build/track.wav
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 build/track.wav

      - name: Build reusable 4K visual loop
        run: |
          set -euo pipefail
          # Encode the short visual source to 4K only ONCE. The final video then
          # reuses these already-encoded packets with stream copy, avoiding an
          # expensive 4K re-encode for every frame of a long music video.
          ffmpeg -hide_banner -loglevel warning -stats -y \
            -i build/loop.mp4 \
            -map 0:v:0 -an \
            -vf "scale=3840:2160:flags=lanczos,setsar=1,fps=30,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 20 -profile:v high -level:v 5.1 \
            -g 60 -keyint_min 60 -sc_threshold 0 \
            -movflags +faststart \
            build/loop-4k.mp4
          test -s build/loop-4k.mp4
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 build/loop-4k.mp4)"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 build/loop-4k.mp4)"
          test "$WIDTH" = "3840"
          test "$HEIGHT" = "2160"
          echo "4K_LOOP_VALIDATED=${WIDTH}x${HEIGHT}"

      - name: Assemble final 4K video without re-encoding video
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -stats -y \
            -stream_loop -1 -i build/loop-4k.mp4 \
            -i build/track.wav \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy \
            -c:a aac -b:a 320k -ar 48000 \
            -shortest \
            -movflags +faststart \
            build/the-office-music-first-video-4k.mp4
          test -s build/the-office-music-first-video-4k.mp4
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 build/the-office-music-first-video-4k.mp4)"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 build/the-office-music-first-video-4k.mp4)"
          test "$WIDTH" = "3840" || (echo "Expected width 3840, got $WIDTH" && exit 1)
          test "$HEIGHT" = "2160" || (echo "Expected height 2160, got $HEIGHT" && exit 1)
          echo "4K_RENDER_VALIDATED=${WIDTH}x${HEIGHT}"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json build/the-office-music-first-video-4k.mp4

      - name: Upload and publish on YouTube
        env:
          INPUT_TITLE: ${{ inputs.title || 'stylish office beats to work to ☕ | lounge house mix' }}
          INPUT_PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError
          from googleapiclient.http import MediaFileUpload

          scopes = ["https://www.googleapis.com/auth/youtube"]
          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=scopes,
          )
          youtube = build("youtube", "v3", credentials=creds, cache_discovery=False)

          channel = youtube.channels().list(part="id,snippet", mine=True).execute()["items"][0]
          if channel["id"] != os.environ["YOUTUBE_CHANNEL_ID"]:
              raise SystemExit("Authenticated channel does not match YOUTUBE_CHANNEL_ID")
          print(f"Authenticated channel: {channel['snippet']['title']}")

          title = os.environ.get("INPUT_TITLE") or "stylish office beats to work to ☕ | lounge house mix"
          privacy = os.environ.get("INPUT_PRIVACY") or "public"
          body = {
              "snippet": {
                  "title": title,
                  "description": (
                      "The Office Music — stylish beats for work, focus and home office.\n\n"
                      "00:00 Midnight Avenue\n\n"
                      "Original music generated for The Office Music.\n"
                      "4K visual loop.\n\n"
                      "#officemusic #focusmusic #workmusic #homeoffice #loungehouse"
                  ),
                  "tags": [
                      "office music", "focus music", "work music", "home office",
                      "lounge house", "deep house", "lofi office", "study music",
                      "background music", "4k office music", "The Office Music"
                  ],
                  "categoryId": "10",
                  "defaultLanguage": "en",
              },
              "status": {
                  "privacyStatus": privacy,
                  "selfDeclaredMadeForKids": False,
              },
          }

          media = MediaFileUpload(
              "build/the-office-music-first-video-4k.mp4",
              mimetype="video/mp4",
              chunksize=32 * 1024 * 1024,
              resumable=True,
          )
          request = youtube.videos().insert(part="snippet,status", body=body, media_body=media)
          response = None
          while response is None:
              status, response = request.next_chunk(num_retries=6)
              if status:
                  print(f"Upload progress: {int(status.progress() * 100)}%")

          video_id = response["id"]
          actual_privacy = response.get("status", {}).get("privacyStatus")
          print(f"YOUTUBE_VIDEO_ID={video_id}")
          print(f"YOUTUBE_PRIVACY_STATUS={actual_privacy}")
          print(f"WATCH_URL=https://www.youtube.com/watch?v={video_id}")

          try:
              thumb = MediaFileUpload("build/thumbnail.jpg", mimetype="image/jpeg", resumable=False)
              youtube.thumbnails().set(videoId=video_id, media_body=thumb).execute()
              print("THUMBNAIL_UPLOAD=OK")
          except HttpError as exc:
              if exc.resp.status == 403:
                  print("::warning::Custom thumbnail is not enabled for this channel yet. The video upload remains successful.")
                  print("THUMBNAIL_UPLOAD=SKIPPED_403")
              else:
                  raise
          PY

      - name: Final status
        if: always()
        run: |
          echo "The Office Music upload workflow finished."
          echo "Target render: 3840x2160 (2160p / 4K)."
