name: PeterLofi Chat and Now Playing Safety Checks

on:
  push:
    paths:
      - '.github/workflows/peterlofi-chat-overlay-tests.yml'
      - 'ovh-streaming/app/chat_requests.py'
      - 'ovh-streaming/app/twitch_chatbot.py'
      - 'ovh-streaming/app/kick_chatbot.py'
      - 'ovh-streaming/scripts/overlay-twitch-commands.py'
      - 'ovh-streaming/scripts/preflight-twitch-now-playing.py'
      - 'ovh-streaming/scripts/preflight-kick-now-playing.py'
      - 'ovh-streaming/scripts/activate-kick-live-overlay.py'
      - 'ovh-streaming/scripts/activate-twitch-live-overlay.py'
      - 'ovh-streaming/tests/test_twitch_hourly.py'
      - 'ovh-streaming/Dockerfile.chatbot'
      - 'ovh-streaming/docker-compose.yml'
      - 'ovh-streaming/app/bot_conversation.py'
      - 'ovh-streaming/app/visual_engine.py'
      - 'ovh-streaming/tests/test_chat_requests.py'
      - 'ovh-streaming/tests/test_bot_conversation.py'
      - 'ovh-streaming/tests/test_visual_overlay_freeze.py'
      - 'ovh-streaming/scripts/activate-twitch-live-overlay.py'
      - 'ovh-streaming/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax and chat cooldown
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile ovh-streaming/app/chat_requests.py ovh-streaming/app/bot_conversation.py ovh-streaming/app/visual_engine.py ovh-streaming/app/twitch_chatbot.py ovh-streaming/app/kick_chatbot.py ovh-streaming/scripts/overlay-twitch-commands.py ovh-streaming/scripts/preflight-twitch-now-playing.py ovh-streaming/scripts/activate-twitch-live-overlay.py ovh-streaming/scripts/preflight-kick-now-playing.py ovh-streaming/scripts/activate-kick-live-overlay.py
          python -m pip install --quiet websockets==15.0.1 grpcio==1.75.1 grpcio-tools==1.75.1 google-auth==2.41.1 requests==2.32.5
          python -m grpc_tools.protoc -Iovh-streaming/app --python_out=ovh-streaming/app --grpc_python_out=ovh-streaming/app ovh-streaming/app/youtube_stream_list.proto
          python ovh-streaming/scripts/overlay-twitch-commands.py --help >/dev/null
          python ovh-streaming/scripts/activate-twitch-live-overlay.py --help >/dev/null
          python ovh-streaming/scripts/activate-twitch-live-overlay.py --help | grep -- --refresh >/dev/null
          python ovh-streaming/scripts/activate-kick-live-overlay.py --help | grep -- --refresh >/dev/null
          cd ovh-streaming
          python -m unittest discover -s tests -v
          python - <<'PY'
          import sys
          sys.path.insert(0,'app')
          import kick_chatbot
          assert kick_chatbot.HOURLY == 5400
          from twitch_chatbot import HOURLY_INTERACTION_SECONDS
          assert HOURLY_INTERACTION_SECONDS == 5400
          assert kick_chatbot.COMMANDS_ENABLED in (True, False)
          from twitch_chatbot import valid_websocket_uri
          assert valid_websocket_uri('wss://eventsub.wss.twitch.tv/ws')
          assert not valid_websocket_uri('wss://evil.example/ws')
          assert not valid_websocket_uri('ws://eventsub.wss.twitch.tv/ws')
          print('Twitch WebSocket destination validation passed')
          PY
      - name: Verify overlay is gated off by default
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('ovh-streaming/app/visual_engine.py').read_text()
          assert 'os.environ.get("VIDEO_NOW_PLAYING_OVERLAY", "0") == "1"' in code
          assert 'self.sync_now_playing_overlay()' in code
          print("Now-playing overlay requires explicit opt-in; no live restart.")
          PY
