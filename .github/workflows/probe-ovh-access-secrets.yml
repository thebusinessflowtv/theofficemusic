name: Probe OVH Access Secret Aliases
# dj100-recovery: 2026-10-03T23:37

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-ovh-access-secrets.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      A: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      B: ${{ secrets.OVH_SSH_KEY }}
      C: ${{ secrets.SSH_PRIVATE_KEY }}
      D: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      E: ${{ secrets.VPS_SSH_KEY }}
      F: ${{ secrets.SSH_KEY }}
      G: ${{ secrets.OVH_PRIVATE_KEY }}
      H: ${{ secrets.OVH_SSH_PASSWORD }}
      I: ${{ secrets.OVH_PASSWORD }}
      J: ${{ secrets.VPS_PASSWORD }}
      K: ${{ secrets.OVH_HOST }}
      L: ${{ secrets.OVH_USER }}
    steps:
      - name: Report only presence
        shell: bash
        run: |
          for n in A B C D E F G H I J K L; do
            if [ -n "${!n:-}" ]; then
              echo "$n=present"
            else
              echo "$n=missing"
            fi
          done
