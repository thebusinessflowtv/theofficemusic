name: YouTube — Smooth Audio Hotfix

on:
  push:
    paths:
      - '.github/workflows/youtube-smooth-audio-hotfix.yml'

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Hot-swap active YouTube lives to smooth-audio V6
        run: python scripts/youtube_smooth_audio_hotfix.py
