name: One-off — Optimize last 3 Peter Lofi descriptions

on:
  push:
    paths:
      - '.github/workflows/oneoff-optimize-last-3-descriptions.yml'

permissions:
  contents: read

jobs:
  optimize-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install YouTube API client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Update descriptions and hashtags
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube'],
          )
          creds.refresh(Request())
          yt = build('youtube', 'v3', credentials=creds, cache_discovery=False)

          descriptions = {
              'YTT9UM1M1SY': """Settle in for 1 hour of warm lofi lounge beats made for studying, reading, deep focus and quiet work. 📖🎧

Let Peter Lofi keep you company with mellow rhythms, soft textures and a cozy atmosphere designed to stay in the background while you concentrate. Perfect for study sessions, reading, creative work, writing or simply slowing down for a while.

🎧 Best for: studying • reading • deep focus • work • relaxing

If this mix helps you focus, leave it playing and come back whenever you need a calm space to work or study.

#Lofi #LofiMusic #StudyMusic #FocusMusic #WorkMusic #ReadingMusic #LoungeMusic #PeterLofi""",

              'OPqTdiiXPY0': """A stylish 1 hour Lounge House mix for work, focus and productivity. ☕💻

Smooth house grooves, polished lounge textures and a refined office atmosphere make this mix ideal for focused work, creative sessions, studying, planning or a relaxed coffee break. Peter Lofi keeps the energy steady without getting in the way of your concentration.

🎧 Best for: work • deep focus • productivity • studying • coffee time • office ambience

Keep it on in the background and turn your workspace into a calm, stylish lounge.

#LoungeHouse #OfficeMusic #WorkMusic #FocusMusic #ProductivityMusic #CoffeeShopMusic #DeepHouse #PeterLofi""",
          }

          ids = ['YTT9UM1M1SY', 'OPqTdiiXPY0', 'teQ-pW_20uk']
          resp = yt.videos().list(part='snippet', id=','.join(ids)).execute()
          items = {item['id']: item for item in resp.get('items', [])}

          for video_id in ids:
              item = items.get(video_id)
              if not item:
                  raise SystemExit(f'Video not found: {video_id}')

              snippet = dict(item['snippet'])
              title = snippet.get('title', '')

              if video_id == 'teQ-pW_20uk':
                  t = title.lower()
                  if any(word in t for word in ['gaming', 'game', 'play', 'chill']):
                      new_description = """1 hour of gaming lofi for late-night play sessions, focus and chill. 🎮🌧️

Settle in with Peter Lofi for mellow beats, a rainy-night atmosphere and a steady soundtrack made to sit naturally behind your game. Great for gaming, grinding, exploring, coding between matches or simply relaxing after a long day.

🎧 Best for: gaming • focus • chill • late-night sessions • relaxing • background music

Press play, get comfortable and let the rainy city mood stay with you for the next hour.

#GamingLofi #Lofi #ChillBeats #GamingMusic #FocusMusic #RainyLofi #ChillMusic #PeterLofi"""
                  else:
                      new_description = """A 1 hour lofi Lounge House mix with smooth beats for work, focus and study. 🎧🌧️

Peter Lofi brings a cool late-night atmosphere with steady lounge-inspired rhythms made for long focus sessions. Put it on while working, studying, planning, creating or whenever you want background music that keeps the mood calm and consistent.

🎧 Best for: work • focus • study • productivity • late-night sessions • relaxing

Stay in the zone and let the mix carry you through the next hour.

#Lofi #LoungeHouse #FocusMusic #WorkMusic #StudyMusic #ChillBeats #LofiMusic #PeterLofi"""
              else:
                  new_description = descriptions[video_id]

              snippet['description'] = new_description
              allowed = {'title','description','tags','categoryId','defaultLanguage','defaultAudioLanguage'}
              snippet = {k: v for k, v in snippet.items() if k in allowed}

              yt.videos().update(part='snippet', body={'id': video_id, 'snippet': snippet}).execute()
              print(f'UPDATED {video_id}')
              print(f'TITLE: {title}')
              print('HASHTAGS:', ' '.join(line for line in new_description.splitlines() if line.startswith('#')))
              print('---')
          PY
