name: Ops — GTA OIDC Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-gta-oidc-preflight.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check non-disruptive host telemetry and isolated audio controls
        run: python3 -m py_compile ovh-streaming/host_deploy_agent.py
      - name: Validate GitHub Actions OIDC against OVH
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mediaforge-ovh")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          CODE="$(curl -ksS -o /tmp/preflight.json -w '%{http_code}'             -X POST "https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/github-youtube-bootstrap"             -H "authorization: Bearer $OIDC_TOKEN"             -H 'content-type: application/json'             --data '{"runtime_slot":"youtube-gta-vi"}')"
          echo "HTTP=$CODE"
          cat /tmp/preflight.json
          test "$CODE" = "400"
          jq -e '.error=="youtube_ingest_required"' /tmp/preflight.json >/dev/null

      - name: Validate isolated Lofi YouTube OAuth bridge without creating a live
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mediaforge-ovh")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          CODE="$(curl -ksS -o /tmp/lofi-preflight.json -w '%{http_code}' -X POST "https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/github-youtube-bootstrap" -H "authorization: Bearer $OIDC_TOKEN" -H 'content-type: application/json' --data '{"runtime_slot":"youtube-lofi-hip-hop","playlist_key":"lofi-hip-hop"}')"
          echo "LOFI_AUTHENTICATED_PREFLIGHT_HTTP=$CODE"
          cat /tmp/lofi-preflight.json
          test "$CODE" = "400"
          jq -e '.error=="youtube_ingest_required"' /tmp/lofi-preflight.json >/dev/null
          CODE="$(curl -ksS -o /tmp/lofi-pairing.json -w '%{http_code}' -X POST "https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/github-youtube-bootstrap" -H "authorization: Bearer $OIDC_TOKEN" -H 'content-type: application/json' --data '{"runtime_slot":"youtube-lofi-hip-hop","playlist_key":"gta-vi-vice-city"}')"
          echo "ISOLATED_PAIRING_GUARD_HTTP=$CODE"
          test "$CODE" = "400"
          jq -e '.error=="playlist_slot_mismatch"' /tmp/lofi-pairing.json >/dev/null
          echo "LOFI_OAUTH_OIDC_PREFLIGHT_PASSED_NO_LIVE_CREATED"

      - name: Read-only check of current Lofi host provisioning command
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mediaforge-ovh")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          CODE="$(curl -ksS -o /tmp/lofi-host-check.json -w '%{http_code}' -X POST "https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/github-youtube-bootstrap-status" -H "authorization: Bearer $OIDC_TOKEN" -H 'content-type: application/json' -d '{"id":"lofi-youtube-1dd4373d-351c-40cc-aa67-774a540fd991"}')"
          echo "CURRENT_LOFI_HOST_COMMAND_HTTP=$CODE"
          jq '{id,status,error,result}' /tmp/lofi-host-check.json
          test "$CODE" = "200"


      - name: Read actual YouTube broadcast lifecycle with existing OAuth
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
          python - <<'PY'
          import os,json
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          creds=Credentials(token=None,refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"])
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)
          bid="W89tRiluh_Y"
          records=yt.liveBroadcasts().list(part="id,status,contentDetails",id=bid).execute().get("items") or []
          if not records:raise SystemExit("Requested Lofi broadcast missing on authorized YouTube channel")
          item=records[0]
          status=item.get("status") or {}
          print("OFFICIAL_YOUTUBE_LOFI_STATUS",json.dumps({
              "broadcast_id":bid,"life_cycle":status.get("lifeCycleStatus"),
              "privacy":status.get("privacyStatus"),
              "bound_stream_exists":bool((item.get("contentDetails") or {}).get("boundStreamId"))
          }),flush=True)
          stream_id=(item.get("contentDetails") or {}).get("boundStreamId") or ""
          if stream_id:
              streams=yt.liveStreams().list(part="id,status",id=stream_id).execute().get("items") or []
              if streams:
                  st=(streams[0].get("status") or {})
                  print("OFFICIAL_YOUTUBE_LOFI_INGEST",json.dumps({
                      "stream_status":st.get("streamStatus"),
                      "health_status":(st.get("healthStatus") or {}).get("status")
                  }),flush=True)
          PY
