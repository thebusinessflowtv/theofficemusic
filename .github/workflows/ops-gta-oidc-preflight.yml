name: Ops — GTA OIDC Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-gta-oidc-preflight.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate GitHub Actions OIDC against OVH
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mediaforge-ovh")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          CODE="$(curl -ksS -o /tmp/preflight.json -w '%{http_code}'             -X POST "https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/github-youtube-bootstrap"             -H "authorization: Bearer $OIDC_TOKEN"             -H 'content-type: application/json'             --data '{"runtime_slot":"youtube-gta-vi"}')"
          echo "HTTP=$CODE"
          cat /tmp/preflight.json
          test "$CODE" = "400"
          jq -e '.error=="youtube_ingest_required"' /tmp/preflight.json >/dev/null
