name: Ops — Probe MediaForge Admin Secret Presence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-probe-mediaforge-admin-secrets.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ADMIN_EMAIL: ${{ secrets.MEDIAFORGE_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.MEDIAFORGE_ADMIN_PASSWORD }}
      GITHUB_BRIDGE_TOKEN: ${{ secrets.MEDIAFORGE_GITHUB_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for v in ADMIN_EMAIL ADMIN_PASSWORD GITHUB_BRIDGE_TOKEN; do
            if [ -n "${!v:-}" ]; then
              echo "$v=present"
            else
              echo "$v=missing"
            fi
          done
