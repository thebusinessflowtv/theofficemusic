name: One-off — Repair Kick Hot Swap

on:
  push:
    paths:
      - '.github/workflows/oneoff-kick-hot-swap-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oneoff-kick-hot-swap-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_HOST: ${{ secrets.OVH_HOST }}
      OVH_USER: ${{ secrets.OVH_USER }}
      OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate OVH access
        shell: bash
        run: |
          set -euo pipefail
          for v in OVH_HOST OVH_USER OVH_SSH_PRIVATE_KEY; do
            test -n "${!v:-}" || { echo "::error::Missing $v"; exit 1; }
          done

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > ~/.ssh/mediaforge_ovh
          chmod 600 ~/.ssh/mediaforge_ovh
          ssh-keyscan -H "$OVH_HOST" >> ~/.ssh/known_hosts

      - name: Install and verify Kick hot-swap
        shell: bash
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/mediaforge_ovh -o BatchMode=yes $OVH_USER@$OVH_HOST"
          $SSH 'bash -s' > /tmp/kick-hot-swap-result.json <<'REMOTE'
          set -euo pipefail
          REPO="$HOME/theofficemusic"
          cd "$REPO"
          git fetch origin main >/dev/null 2>&1
          git reset --hard origin/main >/dev/null
          cd ovh-streaming

          compose() {
            if sudo -n docker compose version >/dev/null 2>&1; then
              sudo -n docker compose "$@"
            else
              sudo -n docker-compose "$@"
            fi
          }

          NEED_DEPLOY="$(python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('state/kick/health.json')
          try:
              d=json.loads(p.read_text())
              print('0' if d.get('status')=='live' and d.get('hot_swap') is True else '1')
          except Exception:
              print('1')
          PY
          )"

          if [ "$NEED_DEPLOY" = "1" ]; then
            compose build kick ovh-agent >/tmp/mediaforge-kick-build.log 2>&1
            compose up -d --no-deps --force-recreate ovh-agent kick >/tmp/mediaforge-kick-up.log 2>&1
          fi

          READY=0
          for i in $(seq 1 48); do
            if python3 - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('state/kick/health.json')
          try:
              d=json.loads(p.read_text())
          except Exception:
              sys.exit(1)
          sys.exit(0 if d.get('status')=='live' and d.get('hot_swap') is True and d.get('encoder_pid') else 1)
          PY
            then
              READY=1
              break
            fi
            sleep 5
          done
          test "$READY" = "1"

          BEFORE_PID="$(python3 - <<'PY'
          import json
          print(json.load(open('state/kick/health.json'))['encoder_pid'])
          PY
          )"
          BEFORE_GEN="$(python3 - <<'PY'
          import json
          print(json.load(open('state/kick/desired.json')).get('generation',1))
          PY
          )"

          python3 - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone
          p=pathlib.Path('state/kick/desired.json')
          d=json.loads(p.read_text())
          d['visual_revision']=int(d.get('visual_revision') or 0)+1
          d['updated_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          tmp=p.with_suffix('.json.tmp')
          tmp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          tmp.replace(p)
          PY

          sleep 10

          export BEFORE_PID BEFORE_GEN
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          h=json.load(open('state/kick/health.json'))
          d=json.load(open('state/kick/desired.json'))
          before_pid=str(os.environ['BEFORE_PID'])
          before_gen=str(os.environ['BEFORE_GEN'])
          after_pid=str(h.get('encoder_pid') or '')
          after_gen=str(d.get('generation',1))
          result={
              'ok': bool(h.get('status')=='live' and h.get('hot_swap') is True and after_pid==before_pid and after_gen==before_gen),
              'status': h.get('status'),
              'fps': h.get('fps'),
              'video_bitrate_kbps': h.get('video_bitrate_kbps'),
              'hot_swap': h.get('hot_swap'),
              'visual_status': h.get('visual_status'),
              'encoder_pid_preserved': after_pid==before_pid,
              'generation_preserved': after_gen==before_gen,
              'encoder_pid': after_pid,
              'generation': after_gen,
              'restarts': h.get('restarts',0),
              'verified_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not result['ok']:
              raise SystemExit(1)
          PY
          REMOTE

          jq . /tmp/kick-hot-swap-result.json
          cp /tmp/kick-hot-swap-result.json control/kick-hot-swap-deploy-result.json

      - name: Publish verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/kick-hot-swap-deploy-result.json
          git commit -m "kick: verify persistent RTMP hot-swap" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/mediaforge_ovh
