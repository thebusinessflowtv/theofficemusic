name: One-off — Kick Stability Recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-kick-stability-recovery.yml"

permissions:
  contents: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop only the OVH Kick publisher
        id: stop
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, pathlib, uuid
          root=pathlib.Path(".")
          active=json.loads((root/"control/kick-active.json").read_text())
          sid=str(active["session_id"])
          cid=f"stability-stop-kick-{uuid.uuid4()}"
          now=dt.datetime.now(dt.timezone.utc).isoformat()
          cmd={"id":cid,"action":"stop","platform":"kick","runtime":"ovh","runtime_slot":"kick","session_id":sid,"requested_at":now,"source":"kick-stability-recovery-v2"}
          p=root/f"control/ovh-commands/{cid}.json"
          p.write_text(json.dumps(cmd,ensure_ascii=False,indent=2)+"\n")
          idxp=root/"control/ovh-commands/index.json"
          idx=json.loads(idxp.read_text()) if idxp.exists() else {"version":1,"commands":[]}
          commands=[x for x in idx.get("commands",[]) if str(x.get("id"))!=cid]
          commands.append({"id":cid,"path":str(p).replace("\\","/"),"created_at":now})
          idx.update({"version":1,"updated_at":now,"commands":commands[-500:]})
          idxp.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+"\n")
          pathlib.Path("/tmp/session_id").write_text(sid)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/ovh-commands
          git commit -m "kick: stop OVH publisher for stability recovery v2"
          for N in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((N*2))
          done
          exit 1

      - name: Allow OVH publisher and ingest session to clear
        run: sleep 40

      - name: Dispatch 720p stability-first Kick encoder
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          SID="$(cat /tmp/session_id)"
          QUEUE="control/kick-live-queue/$SID.json"
          test -s "$QUEUE"
          BEFORE="$(date +%s)"
          jq '{ref:"main",inputs:{
            session_id:(.session_id|tostring),
            track_urls_b64:(.track_urls_b64|tostring),
            duration_minutes:"0",
            title:(.title|tostring),
            description:(.description//""|tostring),
            thumbnail_url:(.thumbnail_url//""|tostring),
            loop_url:(.loop_url|tostring),
            segment_index:"1"
          }}' "$QUEUE" > /tmp/kick-dispatch.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/peter-lofi-kick-live.yml/dispatches" --input /tmp/kick-dispatch.json

          RID=""
          for I in $(seq 1 24); do
            RID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/peter-lofi-kick-live.yml/runs?event=workflow_dispatch&per_page=8" --jq '.workflow_runs[0].id' 2>/dev/null || true)"
            [ -n "$RID" ] && break
            sleep 5
          done
          test -n "$RID"
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Dispatched recovery run $RID"

      - name: Verify stable for 60 seconds
        id: verify
        shell: bash
        run: |
          set -u
          RID="${{ steps.dispatch.outputs.run_id }}"
          SID="$(cat /tmp/session_id)"
          STREAK=0
          STABLE=false

          for I in $(seq 1 18); do
            STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RID" --jq '.status + ":" + (.conclusion // "")' 2>/dev/null || echo unavailable)"
            echo "probe $I run=$STATE"
            if [[ "$STATE" == completed:* && "$STATE" != "completed:success" ]]; then
              echo "Recovery run ended before stability window."
              break
            fi

            RESULT="$(gh api "repos/${GITHUB_REPOSITORY}/contents/control/kick-live-results/$SID.json?ref=main" --jq -r '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
            OK="$(printf '%s' "$RESULT" | jq -r --argjson rid "$RID" '(.github_run_id==$rid) and (.encoder_connected==true) and (.status=="live") and (.kick_verified==true)' 2>/dev/null || echo false)"
            echo "probe $I kick_ok=$OK"

            if [ "$OK" = "true" ]; then STREAK=$((STREAK+1)); else STREAK=0; fi
            if [ "$STREAK" -ge 6 ]; then STABLE=true; break; fi
            sleep 10
          done

          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          [ "$STABLE" = "true" ]

      - name: Restore OVH Kick publisher if recovery is not stable
        if: failure() && steps.stop.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          SID="$(cat /tmp/session_id)"
          python - "$SID" <<'PY'
          import datetime as dt, json, pathlib, sys, uuid
          sid=sys.argv[1]
          root=pathlib.Path(".")
          q=json.loads((root/f"control/kick-live-queue/{sid}.json").read_text())
          cid=f"stability-rollback-kick-{uuid.uuid4()}"
          now=dt.datetime.now(dt.timezone.utc).isoformat()
          cmd={"id":cid,"action":"start","platform":"kick","runtime":"ovh","runtime_slot":"kick","session_id":sid,"title":str(q.get("title") or ""),"loop_url":str(q.get("loop_url") or ""),"requested_at":now,"source":"kick-stability-recovery-v2-rollback"}
          p=root/f"control/ovh-commands/{cid}.json"
          p.write_text(json.dumps(cmd,ensure_ascii=False,indent=2)+"\n")
          idxp=root/"control/ovh-commands/index.json"
          idx=json.loads(idxp.read_text()) if idxp.exists() else {"version":1,"commands":[]}
          commands=[x for x in idx.get("commands",[]) if str(x.get("id"))!=cid]
          commands.append({"id":cid,"path":str(p).replace("\\","/"),"created_at":now})
          idx.update({"version":1,"updated_at":now,"commands":commands[-500:]})
          idxp.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/ovh-commands
          git commit -m "kick: rollback to OVH after unstable recovery"
          for N in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((N*2))
          done
          exit 1
