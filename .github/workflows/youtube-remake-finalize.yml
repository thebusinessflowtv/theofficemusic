name: YouTube Remake Finalizer

on:
  push:
    paths:
      - 'control/youtube-remake-finalize-queue/*.json'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: req
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILE="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '^control/youtube-remake-finalize-queue/[^/]+\.json$' | tail -1 || true)"
          test -n "$FILE"
          OLD_VIDEO_ID="$(jq -r '.old_video_id // empty' "$FILE")"
          NEW_VIDEO_ID="$(jq -r '.new_video_id // empty' "$FILE")"
          test -n "$OLD_VIDEO_ID" && test -n "$NEW_VIDEO_ID"
          echo "old_video_id=$OLD_VIDEO_ID" >> "$GITHUB_OUTPUT"
          echo "new_video_id=$NEW_VIDEO_ID" >> "$GITHUB_OUTPUT"

      - name: Install API client
        run: python -m pip install -q google-api-python-client google-auth google-auth-httplib2

      - name: Verify replacement and privatize original with retry
        env:
          OLD_VIDEO_ID: ${{ steps.req.outputs.old_video_id }}
          NEW_VIDEO_ID: ${{ steps.req.outputs.new_video_id }}
        run: |
          set -euo pipefail
          mkdir -p control/youtube-remakes
          python - <<'PY'
          import json, os, pathlib, time
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          old_id=os.environ['OLD_VIDEO_ID']; new_id=os.environ['NEW_VIDEO_ID']

          def get_video(vid, parts='snippet,status,contentDetails'):
              items=yt.videos().list(part=parts,id=vid).execute().get('items',[])
              if not items: raise SystemExit(f'Video not found: {vid}')
              return items[0]

          old=get_video(old_id)
          new=get_video(new_id)
          if new.get('status',{}).get('privacyStatus')!='public':
              raise SystemExit('Replacement is not public; refusing to privatize original')
          if new.get('snippet',{}).get('title')!=old.get('snippet',{}).get('title'):
              raise SystemExit('Replacement title differs from original; refusing to privatize original')
          if new.get('snippet',{}).get('description')!=old.get('snippet',{}).get('description'):
              raise SystemExit('Replacement description differs from original; refusing to privatize original')

          if old.get('status',{}).get('privacyStatus')!='private':
              os0=old.get('status',{})
              status={'privacyStatus':'private','selfDeclaredMadeForKids':bool(os0.get('selfDeclaredMadeForKids',False))}
              for k in ('embeddable','license','publicStatsViewable'):
                  if k in os0: status[k]=os0[k]
              yt.videos().update(part='status',body={'id':old_id,'status':status}).execute()

          old_privacy=None
          for attempt in range(20):
              old_now=get_video(old_id,'status')
              old_privacy=old_now.get('status',{}).get('privacyStatus')
              print(f'PRIVACY_CHECK {attempt+1}: {old_privacy}')
              if old_privacy=='private': break
              time.sleep(3)
          if old_privacy!='private': raise SystemExit('Original still not private after retries')

          new_final=get_video(new_id)
          if new_final.get('status',{}).get('privacyStatus')!='public':
              raise SystemExit('Replacement is no longer public')

          result={
            'status':'completed',
            'old_video_id':old_id,
            'old_video_url':'https://www.youtube.com/watch?v='+old_id,
            'old_privacy':'private',
            'new_video_id':new_id,
            'new_video_url':'https://www.youtube.com/watch?v='+new_id,
            'new_privacy':'public',
            'title':new_final.get('snippet',{}).get('title'),
            'description':new_final.get('snippet',{}).get('description'),
            'duration':new_final.get('contentDetails',{}).get('duration'),
            'title_identical':new_final.get('snippet',{}).get('title')==old.get('snippet',{}).get('title'),
            'description_identical':new_final.get('snippet',{}).get('description')==old.get('snippet',{}).get('description'),
            'finalized_with_retry':True
          }
          pathlib.Path(f'control/youtube-remakes/{old_id}.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Record result
        env:
          OLD_VIDEO_ID: ${{ steps.req.outputs.old_video_id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add "control/youtube-remakes/${OLD_VIDEO_ID}.json"
          git commit -m "mediaforge: finalize YouTube visual remake ${OLD_VIDEO_ID}" || exit 0
          git push origin HEAD:main
