name: Peter Lofi — YouTube Stop

on:
  push:
    paths:
      - 'control/live-stop/*.json'
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  stop:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YouTube runtime
        run: python -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Resolve session, stop runner, complete broadcast
        env:
          MANUAL_SESSION_ID: ${{ github.event.inputs.session_id || '' }}
        run: |
          set -euo pipefail
          SESSION_ID="${MANUAL_SESSION_ID:-}"
          if [ -z "$SESSION_ID" ]; then
            FILE="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^control/live-stop/[^/]+\.json$' | tail -1 || true)"
            [ -n "$FILE" ] || { echo 'No YouTube stop request found.'; exit 0; }
            SESSION_ID="$(basename "$FILE" .json)"
          fi
          export SESSION_ID
          RESULT="control/live-results/${SESSION_ID}.json"
          if [ ! -s "$RESULT" ]; then
            git fetch origin main
            git checkout origin/main -- "$RESULT" 2>/dev/null || true
          fi
          if [ ! -s "$RESULT" ]; then
            mkdir -p control/live-results
            printf '{}\n' > "$RESULT"
          fi

          RUN_ID="$(jq -r '.github_run_id // empty' "$RESULT")"
          BROADCAST_ID="$(jq -r '.youtube_broadcast_id // empty' "$RESULT")"
          if [ -n "$RUN_ID" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
            sleep 8
          fi
          export BROADCAST_ID
          python - <<'PY'
          import os
          bid=os.environ.get('BROADCAST_ID','').strip()
          if not bid: raise SystemExit(0)
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          try:
              yt.liveBroadcasts().transition(part='status',id=bid,broadcastStatus='complete').execute()
              print('YouTube broadcast completed.')
          except Exception as e:
              print('complete transition warning:',e)
          PY

          git fetch origin main
          git reset --hard origin/main
          mkdir -p control/live-results control/live-stop
          printf '{"stop":true,"requested_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "control/live-stop/${SESSION_ID}.json"
          python - <<'PY'
          import json,os,pathlib,datetime
          sid=os.environ['SESSION_ID']; p=pathlib.Path('control/live-results')/(sid+'.json'); d={}
          try:d=json.loads(p.read_text())
          except Exception:pass
          d['platform']='youtube'; d['session_id']=sid; d['status']='completed'; d['stop_reason']='manual_stop'; d['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat(); p.write_text(json.dumps(d,indent=2),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "control/live-results/${SESSION_ID}.json" "control/live-stop/${SESSION_ID}.json"
          git commit -m "peter-lofi: stop YouTube live ${SESSION_ID}" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
