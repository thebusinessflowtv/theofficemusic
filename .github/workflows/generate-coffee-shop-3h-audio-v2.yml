name: Peter Lofi — Generate 3h Coffee Shop Audio V2 Resumable

on:
  push:
    paths:
      - '.github/workflows/generate-coffee-shop-3h-audio-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: peter-lofi-coffee-shop-3h-audio-v2
  cancel-in-progress: true

env:
  SECRET_DATASET_SLUG: the-office-music-secrets
  RESULT_PATH: control/series-results/12-coffee-shop-3h.json
  CHECKPOINT_TAG: peter-lofi-coffee-shop-3h-checkpoint-v2
  TOTAL_SHARDS: 6

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install kaggle google-api-python-client google-auth google-auth-httplib2
          test -n "$KAGGLE_USERNAME"
          test -n "$KAGGLE_API_TOKEN"
          test -n "$HF_TOKEN"

      - name: Prepare private Hugging Face credential
        run: |
          set -euo pipefail
          SECRET_DIR="$(mktemp -d)"
          trap 'rm -rf "$SECRET_DIR"' EXIT
          printf '%s' "$HF_TOKEN" > "$SECRET_DIR/hf_token.txt"
          chmod 600 "$SECRET_DIR/hf_token.txt"
          python - "$SECRET_DIR" <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          (p/'dataset-metadata.json').write_text(json.dumps({
            'title':'The Office Music Secrets',
            'id':f"{os.environ['KAGGLE_USERNAME']}/the-office-music-secrets",
            'licenses':[{'name':'other'}],
            'description':'Private CI credential input for Peter Lofi generation.'
          }, indent=2))
          PY
          DATASET="$KAGGLE_USERNAME/$SECRET_DATASET_SLUG"
          if kaggle datasets status "$DATASET" >/dev/null 2>&1; then
            kaggle datasets version -p "$SECRET_DIR" -m "Refresh HF token for coffee shop 3h resumable generation" -q
          else
            kaggle datasets create -p "$SECRET_DIR" --private -q
          fi

      - name: Generate or resume Coffee Shop 3h audio
        run: |
          set -euo pipefail

          git fetch origin main
          if git show "origin/main:$RESULT_PATH" > /tmp/existing-result.json 2>/dev/null; then
            if python - <<'PY'
          import json
          p='/tmp/existing-result.json'
          try:
              d=json.load(open(p,encoding='utf-8'))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if d.get('status')=='completed' and d.get('master_audio_url') else 1)
          PY
            then
              echo "Coffee Shop 3h is already completed on origin/main. Nothing to regenerate."
              cat /tmp/existing-result.json
              exit 0
            fi
          fi

          mkdir -p checkpoint build/tracks /tmp/checkpoint-download

          if ! gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$CHECKPOINT_TAG"               --repo "$GITHUB_REPOSITORY"               --target main               --prerelease               --title "Peter Lofi Coffee Shop 3h — Persistent Checkpoint"               --notes "Resumable generation checkpoint. Each asset is one validated 30-minute shard. Do not delete while generation is incomplete."
          fi

          asset_exists() {
            local asset="$1"
            gh release view "$CHECKPOINT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"
          }

          valid_shard() {
            local shard="$1"
            local dir="checkpoint/shard-$shard"
            [ -d "$dir" ] || return 1
            local count
            count="$(find "$dir" -maxdepth 1 -type f -name '*.flac' | wc -l | tr -d ' ')"
            [ "$count" -eq 6 ] || return 1
            while IFS= read -r f; do
              local dur
              dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" 2>/dev/null || true)"
              python - "$dur" <<'PY' || return 1
          import sys
          try: d=float(sys.argv[1])
          except Exception: raise SystemExit(1)
          raise SystemExit(0 if 299.0 <= d <= 301.0 else 1)
          PY
            done < <(find "$dir" -maxdepth 1 -type f -name '*.flac' | sort)
            return 0
          }

          update_progress() {
            local done_count=0
            for n in $(seq 1 "$TOTAL_SHARDS"); do
              if valid_shard "$n"; then done_count=$((done_count+1)); fi
            done
            local minutes=$((done_count*30))
            local pct=$((done_count*100/TOTAL_SHARDS))
            echo "COFFEE PROGRESS: $done_count/$TOTAL_SHARDS shards | $minutes/180 min | $pct%"
            gh release edit "$CHECKPOINT_TAG"               --repo "$GITHUB_REPOSITORY"               --notes "Persistent checkpoint for Coffee Shop 3h. Completed: $done_count/$TOTAL_SHARDS shards ($minutes/180 minutes, $pct%). A failed run resumes from these assets." >/dev/null
          }

          store_shard() {
            local shard="$1"
            shift
            if [ "$#" -ne 6 ]; then
              echo "store_shard expected 6 WAV files for shard $shard, got $#"
              return 1
            fi
            rm -rf "checkpoint/shard-$shard"
            mkdir -p "checkpoint/shard-$shard"
            local idx=1
            for src in "$@"; do
              local base
              base="$(basename "$src" .wav | tr -cs 'A-Za-z0-9._-' '-')"
              local out
              out="checkpoint/shard-$shard/$(printf '%02d' "$idx")-$base.flac"
              ffmpeg -hide_banner -loglevel error -y -i "$src" -c:a flac -compression_level 5 "$out"
              idx=$((idx+1))
            done
            valid_shard "$shard"
            local asset="coffee-shop-shard-$shard.tar.gz"
            tar -C checkpoint -czf "/tmp/$asset" "shard-$shard"
            gh release upload "$CHECKPOINT_TAG" "/tmp/$asset"               --repo "$GITHUB_REPOSITORY" --clobber
            echo "Checkpoint persisted: shard $shard/6 (30 minutes)."
            update_progress
          }

          echo "Restoring persistent checkpoints..."
          for SHARD in $(seq 1 "$TOTAL_SHARDS"); do
            ASSET="coffee-shop-shard-$SHARD.tar.gz"
            if asset_exists "$ASSET"; then
              rm -rf "/tmp/checkpoint-download/$SHARD"
              mkdir -p "/tmp/checkpoint-download/$SHARD"
              gh release download "$CHECKPOINT_TAG"                 --repo "$GITHUB_REPOSITORY"                 --pattern "$ASSET"                 --dir "/tmp/checkpoint-download/$SHARD"
              tar -xzf "/tmp/checkpoint-download/$SHARD/$ASSET" -C checkpoint
              if valid_shard "$SHARD"; then
                echo "Restored shard $SHARD/6."
              else
                echo "Checkpoint shard $SHARD is invalid; it will be regenerated."
                rm -rf "checkpoint/shard-$SHARD"
              fi
            fi
          done
          update_progress

          ROOT_REQUEST_ID="coffee-shop-3h-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          for WAVE_START in 1 2 3 4 5 6; do
            WAVE_END="$WAVE_START"
            echo "Preparing shards $WAVE_START-$WAVE_END..."

            SUBMITTED=0
            for SHARD in $(seq "$WAVE_START" "$WAVE_END"); do
              if valid_shard "$SHARD"; then
                echo "Shard $SHARD/6 already checkpointed; skipping generation."
                continue
              fi

              WORK="$(mktemp -d)"
              cp kaggle/runner_coffee_shop_3h.py "$WORK/runner.py"
              REQUEST_ID="$ROOT_REQUEST_ID-s$SHARD"
              KERNEL_NAME="peter-lofi-coffee-v2-$GITHUB_RUN_ID-shard-$SHARD"

              python - "$WORK/runner.py" "$REQUEST_ID" "$SHARD" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); request_id=sys.argv[2]; shard=int(sys.argv[3])
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'REQUEST_ID = "[^"]*"', f'REQUEST_ID = "{request_id}"', text, count=1)
          text=re.sub(r'SHARD_INDEX = \d+', f'SHARD_INDEX = {shard}', text, count=1)
          text=re.sub(r'TRACK_COUNT = \d+', 'TRACK_COUNT = 15', text, count=1)
          text=re.sub(r'FINAL_TRACK_COUNT = \d+', 'FINAL_TRACK_COUNT = 6', text, count=1)
          p.write_text(text, encoding='utf-8')
          PY

              python - "$WORK" "$KERNEL_NAME" "$SHARD" <<'PY'
          import json, os, pathlib, sys
          p=pathlib.Path(sys.argv[1]); kernel=sys.argv[2]; shard=sys.argv[3]
          (p/'kernel-metadata.json').write_text(json.dumps({
            'id':f"{os.environ['KAGGLE_USERNAME']}/{kernel}",
            'title':f"Peter Lofi Coffee Shop V2 {os.environ['GITHUB_RUN_ID']} Shard {shard}",
            'code_file':'runner.py',
            'language':'python',
            'kernel_type':'script',
            'is_private':True,
            'enable_gpu':True,
            'machine_shape':'NvidiaTeslaT4',
            'enable_internet':True,
            'dataset_sources':[f"{os.environ['KAGGLE_USERNAME']}/the-office-music-secrets"],
            'competition_sources':[],
            'kernel_sources':[]
          }, indent=2))
          PY

              echo "Submitting coffee shop shard $SHARD/6..."
              KERNEL_REF=""
              for PUSH_TRY in $(seq 1 60); do
                PUSH_OUTPUT="$(kaggle kernels push -p "$WORK" --timeout 7200 --accelerator NvidiaTeslaT4 2>&1 || true)"
                printf '%s\n' "$PUSH_OUTPUT"
                if echo "$PUSH_OUTPUT" | grep -Eqi 'Maximum batch GPU session count|maximum.*GPU.*session'; then
                  echo "Kaggle GPU capacity is busy (attempt $PUSH_TRY/60). Retrying in 60 seconds..."
                  sleep 60
                  continue
                fi
                if echo "$PUSH_OUTPUT" | grep -Eqi 'Kernel push error|Traceback|Permission.*denied'; then
                  echo "Kaggle rejected shard $SHARD for a non-capacity reason."
                  exit 1
                fi
                KERNEL_REF="$(printf '%s\n' "$PUSH_OUTPUT" | sed -nE 's#.*https://www\.kaggle\.com/code/([^/[:space:]]+)/([^[:space:]]+).*#\1/\2#p' | tail -n 1)"
                if [ -z "$KERNEL_REF" ]; then
                  KERNEL_REF="$KAGGLE_USERNAME/$KERNEL_NAME"
                fi
                break
              done
              test -n "$KERNEL_REF" || { echo "Could not obtain a Kaggle GPU slot for shard $SHARD."; exit 1; }
              printf '%s' "$KERNEL_REF" > "/tmp/kernel_ref_$SHARD"
              printf '%s' "$REQUEST_ID" > "/tmp/request_id_$SHARD"
              rm -f "/tmp/done_$SHARD"
              SUBMITTED=1
            done

            [ "$SUBMITTED" -eq 1 ] || continue
            sleep 10

            WAVE_COMPLETE=0
            for i in $(seq 1 90); do
              ALL_DONE=1
              for SHARD in $(seq "$WAVE_START" "$WAVE_END"); do
                if valid_shard "$SHARD" || [ -f "/tmp/done_$SHARD" ]; then
                  continue
                fi
                if [ ! -f "/tmp/kernel_ref_$SHARD" ]; then
                  continue
                fi

                ALL_DONE=0
                KERNEL_REF="$(cat "/tmp/kernel_ref_$SHARD")"
                STATUS="$(kaggle kernels status "$KERNEL_REF" 2>&1 || true)"
                echo "[coffee shard $SHARD/6] $STATUS"

                if echo "$STATUS" | grep -Eqi 'Cannot access kernel|Permission .*kernels\.get.*denied|wrong kernel slug'; then
                  echo "Shard $SHARD cannot be addressed using the slug returned by Kaggle. Failing immediately; completed checkpoints remain safe."
                  exit 1
                fi

                if [ $((i % 2)) -eq 0 ]; then
                  echo "----- live progress shard $SHARD/6 -----"
                  kaggle kernels logs "$KERNEL_REF" 2>&1 | tail -n 60 || true
                  echo "----------------------------------------"
                fi

                if echo "$STATUS" | grep -Eqi 'complete|completed'; then
                  DEST="/tmp/generated-shard-$SHARD"
                  rm -rf "$DEST"
                  mkdir -p "$DEST"
                  kaggle kernels output "$KERNEL_REF" -p "$DEST"
                  mapfile -t WAVS < <(find "$DEST" -type f -name '*.wav' | sort)
                  if [ "${#WAVS[@]}" -ne 6 ]; then
                    echo "Expected 6 final WAVs in shard $SHARD; got ${#WAVS[@]}."
                    exit 1
                  fi
                  MARKER="$(find "$DEST" -type f -name request_id.txt -print -quit)"
                  EXPECTED_REQUEST="$(cat "/tmp/request_id_$SHARD")"
                  test -n "$MARKER"
                  test "$(tr -d '\r\n ' < "$MARKER")" = "$EXPECTED_REQUEST"
                  store_shard "$SHARD" "${WAVS[@]}"
                  touch "/tmp/done_$SHARD"
                elif echo "$STATUS" | grep -Eqi 'error|failed|cancel'; then
                  echo "Coffee Shop shard $SHARD/6 failed. Checkpointed shards remain safe."
                  kaggle kernels logs "$KERNEL_REF" 2>&1 | tail -n 250 || true
                  exit 1
                fi
              done

              if [ "$ALL_DONE" -eq 1 ]; then
                WAVE_COMPLETE=1
                break
              fi
              sleep 60
            done

            if [ "$WAVE_COMPLETE" -ne 1 ]; then
              echo "Generation wave $WAVE_START-$WAVE_END timed out. Existing checkpoints remain safe."
              exit 1
            fi
          done

          update_progress

          for SHARD in $(seq 1 "$TOTAL_SHARDS"); do
            valid_shard "$SHARD" || { echo "Missing or invalid final checkpoint shard $SHARD"; exit 1; }
          done

          rm -rf build
          mkdir -p build/tracks
          python - <<'PY'
          import pathlib,re,subprocess
          files=[]
          for shard in range(1,7):
              part=sorted((pathlib.Path('checkpoint')/f'shard-{shard}').glob('*.flac'))
              if len(part)!=6:
                  raise SystemExit(f'Shard {shard}: expected 6 FLACs, got {len(part)}')
              files.extend(part)
          if len(files)!=36:
              raise SystemExit(f'Expected 36 checkpoint tracks, got {len(files)}')
          with open('build/concat.txt','w',encoding='utf-8') as f:
              for p in files:
                  f.write("file '"+str(p.resolve()).replace("'","'\\''")+"'\n")
          for i,p in enumerate(files,1):
              stem=re.sub(r'[^a-zA-Z0-9._-]+','-',p.stem).strip('-').lower()
              out=pathlib.Path('build/tracks')/f'{i:02d}-{stem}.mp3'
              subprocess.run([
                  'ffmpeg','-hide_banner','-loglevel','error','-y','-i',str(p),
                  '-t','300','-vn','-c:a','libmp3lame','-b:a','320k','-ar','48000','-ac','2',str(out)
              ],check=True)
          PY

          ffmpeg -hide_banner -loglevel warning -stats -y             -f concat -safe 0 -i build/concat.txt             -t 10800 -vn -c:a libmp3lame -b:a 320k -ar 48000 -ac 2             build/peter-lofi-coffee-shop-3h.mp3

          test -s build/peter-lofi-coffee-shop-3h.mp3
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/peter-lofi-coffee-shop-3h.mp3)"
          python - "$DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 10798 <= d <= 10802:
              raise SystemExit(f'Unexpected master duration: {d}')
          print(f'Master duration: {d:.3f}s')
          PY
          test "$(find build/tracks -type f -name '*.mp3' | wc -l | tr -d ' ')" -eq 36

          echo "Reconstructing the user-provided Coffee Shop visual loop..."
          cat assets/coffee-shop-3h-loop/0*.b64 | tr -d '\r\n ' | base64 --decode > build/coffee-shop-loop.mp4
          test -s build/coffee-shop-loop.mp4
          ffmpeg -hide_banner -v error -i build/coffee-shop-loop.mp4 -map 0:v:0 -f null -
          LOOP_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/coffee-shop-loop.mp4)"
          python - "$LOOP_DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 7.9 <= d <= 8.1:
              raise SystemExit(f'Unexpected loop duration: {d}')
          print(f'Visual loop validated: {d:.3f}s')
          PY

          echo "Preparing the loop at 1280x720 / 24 fps..."
          ffmpeg -hide_banner -loglevel warning -y \
            -i build/coffee-shop-loop.mp4 -an \
            -vf "scale=1280:720:flags=lanczos,fps=24,format=yuv420p" \
            -c:v libx264 -preset slow -crf 18 -profile:v high \
            -g 48 -keyint_min 48 -sc_threshold 0 -movflags +faststart \
            build/coffee-shop-loop-720p.mp4
          test -s build/coffee-shop-loop-720p.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 build/coffee-shop-loop-720p.mp4)" = "1280"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 build/coffee-shop-loop-720p.mp4)" = "720"

          echo "Building 3-hour Coffee Shop video from the 720p visual loop + generated master..."
          ffmpeg -hide_banner -loglevel warning -stats -y \
            -stream_loop -1 -i build/coffee-shop-loop-720p.mp4 \
            -i build/peter-lofi-coffee-shop-3h.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 320k -ar 48000 -ac 2 \
            -t 10800 -shortest -movflags +faststart \
            build/peter-lofi-coffee-shop-3h-video.mp4
          test -s build/peter-lofi-coffee-shop-3h-video.mp4
          VIDEO_DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 build/peter-lofi-coffee-shop-3h-video.mp4)"
          python - "$VIDEO_DURATION" <<'PY'
          import sys
          d=float(sys.argv[1])
          if not 10798 <= d <= 10802:
              raise SystemExit(f'Unexpected final video duration: {d}')
          print(f'Final video duration: {d:.3f}s')
          PY

          echo "Uploading Coffee Shop 3h to YouTube as PRIVATE..."
          python - <<'PY'
          import json, os, pathlib
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          required=['YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN','YOUTUBE_CHANNEL_ID']
          missing=[k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit('Missing YouTube credentials: '+', '.join(missing))

          creds=Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube'],
          )
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          channel=yt.channels().list(part='id,snippet',mine=True).execute()['items'][0]
          if channel['id'] != os.environ['YOUTUBE_CHANNEL_ID']:
              raise SystemExit('Authenticated YouTube channel does not match YOUTUBE_CHANNEL_ID')

          body={
              'snippet':{
                  'title':'3 Hours Coffee Shop Lofi ☕ Beats to Work, Study & Focus | Peter Lofi',
                  'description':(
                      'Three hours of original instrumental Peter Lofi coffee-shop music '
                      'for work, study, reading and relaxed focus.\n\n'
                      'Original music with a seamless looping visual.\n\n'
                      '#lofi #coffeeshoplofi #studymusic #workmusic #focusmusic #PeterLofi'
                  ),
                  'tags':[
                      'coffee shop lofi','lofi','lofi music','study music','work music',
                      'focus music','coffee shop music','Peter Lofi','background music',
                      'chill beats','beats to study to','beats to work to'
                  ],
                  'categoryId':'10',
                  'defaultLanguage':'en',
              },
              'status':{
                  'privacyStatus':'private',
                  'selfDeclaredMadeForKids':False,
              },
          }
          media=MediaFileUpload(
              'build/peter-lofi-coffee-shop-3h-video.mp4',
              mimetype='video/mp4',
              chunksize=32*1024*1024,
              resumable=True,
          )
          req=yt.videos().insert(part='snippet,status',body=body,media_body=media)
          response=None
          while response is None:
              status,response=req.next_chunk(num_retries=8)
              if status:
                  print(f'YouTube upload: {int(status.progress()*100)}%')
          video_id=response['id']
          privacy=response.get('status',{}).get('privacyStatus')
          if privacy != 'private':
              raise SystemExit(f'Unexpected YouTube privacy status: {privacy}')
          result={
              'youtube_video_id':video_id,
              'youtube_url':f'https://www.youtube.com/watch?v={video_id}',
              'youtube_privacy':'private'
          }
          pathlib.Path('build/youtube.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print('YouTube private upload complete:', result['youtube_url'])
          PY

          TAG="peter-lofi-coffee-shop-3h-v2-$GITHUB_RUN_ID"
          gh release create "$TAG"             build/peter-lofi-coffee-shop-3h.mp3 build/tracks/*.mp3             --repo "$GITHUB_REPOSITORY"             --target main             --title "Peter Lofi — Coffee Shop · 3 Hour Audio"             --notes "Resumable V2 output: 36 original 5-minute tracks, 3-hour master, audio only."

          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          MASTER_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/peter-lofi-coffee-shop-3h.mp3"

          git fetch origin main
          git rebase origin/main

          python - "$TAG" "$RELEASE_URL" "$MASTER_URL" <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, subprocess, sys
          tag,release_url,master_url=sys.argv[1:4]
          youtube=json.loads(pathlib.Path('build/youtube.json').read_text(encoding='utf-8'))
          tracks=[]
          for pos,p in enumerate(sorted(pathlib.Path('build/tracks').glob('*.mp3')),1):
              duration=float(subprocess.check_output([
                  'ffprobe','-v','error','-show_entries','format=duration',
                  '-of','default=nw=1:nk=1',str(p)
              ],text=True).strip())
              tracks.append({
                  'title':p.stem,
                  'filename':p.name,
                  'duration_seconds':round(duration,3),
                  'position':pos,
                  'start_seconds':(pos-1)*300,
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'download_url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{tag}/{p.name}'
              })
          data={
              'status':'completed',
              'copyright_status':'pending_private_youtube_check',
              'distribution_blocked':True,
              'progress':100,
              'phase':'Gerada e enviada ao YouTube como privada; aguardando verificação de direitos antes da distribuição',
              'index':12,
              'key':'coffee-shop-3h',
              'name':'Coffee Shop 3H',
              'title':'3 Hours Coffee Shop Lofi ☕ Beats to Work, Study & Focus | Peter Lofi',
              'playlist':'Coffee Shop ☕ | Peter Lofi',
              'description':'Three hours of original instrumental Peter Lofi coffee-shop music for work, study, reading and relaxed focus.',
              'duration_minutes':180,
              'generation_mode':'stable-audio-3-small-music-resumable-v2',
              'checkpoint_tag':os.environ['CHECKPOINT_TAG'],
              'release_tag':tag,
              'release_url':release_url,
              'master_audio_url':master_url,
              'master_filename':'peter-lofi-coffee-shop-3h.mp3',
              'master_video_filename':'peter-lofi-coffee-shop-3h-video.mp4',
              'visual_loop_source':'user-uploaded-video',
              'youtube_video_id':youtube['youtube_video_id'],
              'youtube_url':youtube['youtube_url'],
              'youtube_privacy':youtube['youtube_privacy'],
              'tracks':tracks,
              'github_run_id':int(os.environ['GITHUB_RUN_ID']),
              'github_run_url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
              'completed_at':dt.datetime.now(dt.timezone.utc).isoformat()
          }
          path=pathlib.Path(os.environ['RESULT_PATH'])
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$RESULT_PATH"
          git commit -m "mediaforge: register resumable 3h coffee shop audio"
          for i in $(seq 1 10); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              break
            fi
            git rebase --abort || true
            if [ "$i" -eq 10 ]; then
              echo "Could not push final Coffee Shop result metadata."
              exit 1
            fi
            sleep "$i"
          done

          gh release edit "$CHECKPOINT_TAG"             --repo "$GITHUB_REPOSITORY"             --notes "Coffee Shop 3h completed successfully. Persistent shards: 6/6 (180/180 minutes). Final release: $RELEASE_URL" >/dev/null

          echo "Coffee Shop 3h completed: $MASTER_URL"
