name: Peter Lofi — YouTube Successor Direct

on:
  push:
    branches: [main]
    paths:
      - 'control/live-successor-youtube/*.json'

permissions:
  contents: write

concurrency:
  group: peter-lofi-youtube-successor-direct
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      YOUTUBE_CATEGORY_ID: "10"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve successor payload
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          FILE="$(printf '%s\n' "$CHANGED" | grep -E '^control/live-successor-youtube/[^/]+\.json$' | tail -1 || true)"
          [ -n "$FILE" ] && [ -s "$FILE" ] || { echo "No YouTube successor payload."; exit 1; }
          jq -e . "$FILE" >/dev/null
          python - "$FILE" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          mapping={
            "SESSION_ID":"session_id","TRACK_URLS_B64":"track_urls_b64","DURATION_MINUTES":"duration_minutes",
            "TITLE":"title","DESCRIPTION":"description","THUMBNAIL_URL":"thumbnail_url","LOOP_URL":"loop_url",
            "RESUME_BROADCAST_ID":"resume_broadcast_id","RESUME_STREAM_ID":"resume_stream_id",
            "SEGMENT_INDEX":"segment_index","PRIVACY_STATUS":"privacy_status",
            "SEGMENT_SECONDS_OVERRIDE":"segment_seconds_override","PREWARM_LEAD_SECONDS":"prewarm_lead_seconds","MAX_SEGMENTS":"max_segments",
          }
          defaults={"PRIVACY_STATUS":"public","SEGMENT_SECONDS_OVERRIDE":"0","PREWARM_LEAD_SECONDS":"900","MAX_SEGMENTS":"0"}
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              for env,key in mapping.items():
                  v=str(d.get(key) if d.get(key) is not None else defaults.get(env,""))
                  marker="MF_"+env+"_EOF"
                  f.write(f"{env}<<{marker}\n{v}\n{marker}\n")
          PY

      - name: Prepare runtime
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg file
          python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2 cryptography

      - name: Refuse duplicate owner
        id: owner
        run: |
          set -euo pipefail
          READY="control/live-ready/${SESSION_ID}-${SEGMENT_INDEX}.json"
          if [ -s "$READY" ]; then
            OWNER="$(jq -r '.run_id // 0' "$READY")"
            if [ "$OWNER" != "0" ] && [ "$OWNER" != "$GITHUB_RUN_ID" ]; then
              echo "Existing YouTube prewarm owner: $OWNER"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run prewarmed YouTube successor
        if: steps.owner.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python scripts/mediaforge_live_segment_v8.py
