name: One-off — Restart Twitch Stable Profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-restart-twitch-stable.yml'

permissions:
  contents: read
  actions: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Stop current Twitch encoder and restart same station
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE="control/twitch-active.json"
          test -s "$ACTIVE"
          SESSION_ID="$(jq -r '.session_id' "$ACTIVE")"
          RUN_ID="$(jq -r '.run_id // empty' "$ACTIVE")"
          QUEUE="control/twitch-live-queue/${SESSION_ID}.json"
          test -s "$QUEUE"

          if [ -n "$RUN_ID" ]; then
            echo "Cancelling current Twitch run $RUN_ID"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" >/dev/null 2>&1 || true
            for i in $(seq 1 30); do
              STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.status' 2>/dev/null || true)"
              [ "$STATE" = "completed" ] && break
              sleep 2
            done
          fi

          jq '{ref:"main",inputs:{
            session_id:(.session_id|tostring),
            track_urls_b64:(.track_urls_b64|tostring),
            duration_minutes:(.duration_minutes//"0"|tostring),
            title:(.title|tostring),
            description:(.description//""|tostring),
            loop_url:(.loop_url|tostring),
            segment_index:"1"
          }}' "$QUEUE" > /tmp/twitch-dispatch.json

          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/peter-lofi-twitch-live.yml/dispatches" --input /tmp/twitch-dispatch.json
          echo "Twitch stable-profile restart dispatched for ${SESSION_ID}."

