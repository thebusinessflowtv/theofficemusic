name: One-off — Start YouTube Deep House V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-youtube-deep-house-start-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Ensure Deep House broadcast is bound and live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, pathlib, time
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          root=pathlib.Path(".")
          cfg_path=root/"control/youtube-stations.json"
          cfg=json.loads(cfg_path.read_text(encoding="utf-8"))
          station=next(x for x in cfg["stations"] if x["key"]=="deep-house")
          sid=str(station["youtube_stream_id"])
          bid=str(station.get("youtube_broadcast_id") or "")
          session_id=str(station["current_session_id"])
          result_path=root/f"control/live-results/{session_id}.json"
          result=json.loads(result_path.read_text(encoding="utf-8")) if result_path.exists() else {}
          title=str(result.get("title") or "deep house radio 💻 music to work/study/focus to | Peter Lofi 🎧")
          description=str(result.get("description") or "🎧 Peter Lofi — original deep house and chill house music for work, study, focus and late-night sessions.")

          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)

          def get_broadcast(bid):
              if not bid:
                  return None
              items=yt.liveBroadcasts().list(part="snippet,status,contentDetails",id=bid).execute().get("items") or []
              return items[0] if items else None

          def get_stream():
              items=yt.liveStreams().list(part="status,cdn",id=sid).execute().get("items") or []
              return items[0] if items else None

          b=get_broadcast(bid)
          lifecycle=((b or {}).get("status") or {}).get("lifeCycleStatus")

          if not b or lifecycle=="complete":
              scheduled=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(seconds=20)).isoformat().replace("+00:00","Z")
              created=yt.liveBroadcasts().insert(
                  part="snippet,status,contentDetails",
                  body={
                      "snippet":{"title":title,"description":description,"scheduledStartTime":scheduled},
                      "status":{"privacyStatus":"public","selfDeclaredMadeForKids":False},
                      "contentDetails":{
                          "enableAutoStart":True,
                          "enableAutoStop":False,
                          "enableDvr":True,
                          "recordFromStart":True,
                          "latencyPreference":"normal",
                      },
                  },
              ).execute()
              bid=str(created["id"])
              yt.liveBroadcasts().bind(part="id,contentDetails",id=bid,streamId=sid).execute()
              b=get_broadcast(bid)
              lifecycle=((b or {}).get("status") or {}).get("lifeCycleStatus")

          # Wait for the explicitly requested OVH publisher reconnect.
          proof={}
          transitioned=False
          for attempt in range(1,81):
              s=get_stream() or {}
              b=get_broadcast(bid) or {}
              bs=b.get("status") or {}
              ss=s.get("status") or {}
              hs=ss.get("healthStatus") or {}
              proof={
                  "broadcast_id":bid,
                  "stream_id":sid,
                  "lifecycle":bs.get("lifeCycleStatus"),
                  "privacy":bs.get("privacyStatus"),
                  "stream_status":ss.get("streamStatus"),
                  "health_status":hs.get("status") if isinstance(hs,dict) else hs,
                  "configuration_issues":hs.get("configurationIssues",[]) if isinstance(hs,dict) else [],
                  "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              }
              print("probe",attempt,json.dumps(proof,ensure_ascii=False))
              if proof["stream_status"]=="active" and proof["lifecycle"]!="live" and not transitioned:
                  try:
                      yt.liveBroadcasts().transition(
                          part="id,status,contentDetails",
                          id=bid,
                          broadcastStatus="live",
                      ).execute()
                      transitioned=True
                      print("manual transition requested")
                  except HttpError as exc:
                      print("transition not ready yet:",exc)
              if proof["lifecycle"]=="live" and proof["stream_status"]=="active":
                  break
              time.sleep(5)

          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          station["youtube_broadcast_id"]=bid
          station["updated_at"]=now
          station["status"]="live" if proof.get("lifecycle")=="live" and proof.get("stream_status")=="active" else "starting"
          cfg["updated_at"]=now
          cfg_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          result.update({
              "platform":"youtube",
              "runtime":"ovh",
              "runtime_slot":"youtube-deep-house",
              "youtube_broadcast_id":bid,
              "youtube_stream_id":sid,
              "youtube_url":f"https://www.youtube.com/watch?v={bid}",
              "status":station["status"],
              "privacy_status":"public",
              "enable_auto_start":True,
              "enable_auto_stop":False,
              "last_verified_lifecycle":proof.get("lifecycle"),
              "health_status":proof.get("health_status"),
              "youtube_api_verification_uncertain":False,
              "verified_at":now,
          })
          if station["status"]=="live":
              result["live_at"]=now
          result_path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          diag=root/"control/diagnostics/deep-house-start-v2.json"
          diag.parent.mkdir(parents=True,exist_ok=True)
          diag.write_text(json.dumps(proof,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          if station["status"]!="live":
              raise SystemExit("Deep House publisher/broadcast did not reach live: "+json.dumps(proof))
          PY

      - name: Persist verified YouTube state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/youtube-stations.json control/live-results/8cf99db8-3e53-4b74-b9d2-51fb67b54ff8.json control/diagnostics/deep-house-start-v2.json
          git commit -m "youtube: verify Deep House live on OVH" || exit 0
          for N in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((N*2))
          done
          exit 1
