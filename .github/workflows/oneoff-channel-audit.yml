name: One-off — Peter Lofi Channel Audit

on:
  push:
    paths:
      - '.github/workflows/oneoff-channel-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install YouTube API client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Fetch channel and recent video stats
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import os, json, re
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          creds = Credentials(token=None, refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'], token_uri='https://oauth2.googleapis.com/token', client_id=os.environ['YOUTUBE_CLIENT_ID'], client_secret=os.environ['YOUTUBE_CLIENT_SECRET'], scopes=['https://www.googleapis.com/auth/youtube'])
          creds.refresh(Request())
          yt = build('youtube', 'v3', credentials=creds, cache_discovery=False)
          cid = os.environ['YOUTUBE_CHANNEL_ID']

          ch = yt.channels().list(part='snippet,statistics,contentDetails', id=cid).execute()['items'][0]
          print('CHANNEL', json.dumps({
              'title': ch['snippet'].get('title'),
              'subscribers': ch['statistics'].get('subscriberCount'),
              'views': ch['statistics'].get('viewCount'),
              'videos': ch['statistics'].get('videoCount'),
              'uploadsPlaylist': ch['contentDetails']['relatedPlaylists']['uploads']
          }, ensure_ascii=False))

          uploads = ch['contentDetails']['relatedPlaylists']['uploads']
          items = yt.playlistItems().list(part='contentDetails,snippet', playlistId=uploads, maxResults=20).execute().get('items', [])
          ids = [x['contentDetails']['videoId'] for x in items]
          vids = yt.videos().list(part='snippet,statistics,contentDetails,liveStreamingDetails', id=','.join(ids)).execute().get('items', [])
          byid = {v['id']: v for v in vids}
          for x in items:
              vid = x['contentDetails']['videoId']
              v = byid.get(vid)
              if not v: continue
              s=v['snippet']; st=v.get('statistics',{}); cd=v.get('contentDetails',{}); live=v.get('liveStreamingDetails',{})
              row={
                'id':vid,
                'title':s.get('title'),
                'publishedAt':s.get('publishedAt'),
                'views':st.get('viewCount'),
                'likes':st.get('likeCount'),
                'comments':st.get('commentCount'),
                'duration':cd.get('duration'),
                'liveActualStart':live.get('actualStartTime'),
                'liveConcurrent':live.get('concurrentViewers')
              }
              print('VIDEO', json.dumps(row, ensure_ascii=False))
          PY
