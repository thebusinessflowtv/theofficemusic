name: Transition Deep House Live Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/transition-deep-house-live-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Transition ready broadcast to live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, pathlib, time
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          cfg=json.loads(pathlib.Path("control/youtube-stations.json").read_text())
          st=next(x for x in cfg["stations"] if x["key"]=="deep-house")
          bid=str(st["youtube_broadcast_id"])
          sid=str(st["youtube_stream_id"])

          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)

          stream=(yt.liveStreams().list(part="status",id=sid).execute().get("items") or [None])[0]
          ss=(stream or {}).get("status") or {}
          if ss.get("streamStatus")!="active":
              raise SystemExit("publisher not active: "+json.dumps(ss))

          b=(yt.liveBroadcasts().list(part="status,contentDetails",id=bid).execute().get("items") or [None])[0]
          bs=(b or {}).get("status") or {}
          lifecycle=bs.get("lifeCycleStatus")
          if lifecycle!="live":
              yt.liveBroadcasts().transition(part="id,status",id=bid,broadcastStatus="live").execute()

          proof={}
          for _ in range(24):
              b=(yt.liveBroadcasts().list(part="status,contentDetails",id=bid).execute().get("items") or [None])[0]
              s=(yt.liveStreams().list(part="status",id=sid).execute().get("items") or [None])[0]
              bs=(b or {}).get("status") or {}
              ss=(s or {}).get("status") or {}
              hs=ss.get("healthStatus") or {}
              proof={
                  "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "broadcast_id":bid,
                  "stream_id":sid,
                  "lifecycle":bs.get("lifeCycleStatus"),
                  "stream_status":ss.get("streamStatus"),
                  "health_status":hs.get("status") if isinstance(hs,dict) else hs,
              }
              print(json.dumps(proof))
              if proof["lifecycle"]=="live" and proof["stream_status"]=="active":
                  break
              time.sleep(5)

          if proof.get("lifecycle")!="live":
              raise SystemExit("transition did not reach live: "+json.dumps(proof))

          pathlib.Path("control/diagnostics/deep-house-transition-live.json").write_text(json.dumps(proof,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Persist proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,datetime
          proof=json.loads(pathlib.Path("control/diagnostics/deep-house-transition-live.json").read_text())
          now=proof["checked_at"]
          cp=pathlib.Path("control/youtube-stations.json")
          cfg=json.loads(cp.read_text())
          st=next(x for x in cfg["stations"] if x["key"]=="deep-house")
          st["status"]="live";st["updated_at"]=now;cfg["updated_at"]=now
          cp.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+"\n")
          rp=pathlib.Path("control/live-results/8cf99db8-3e53-4b74-b9d2-51fb67b54ff8.json")
          r=json.loads(rp.read_text())
          r["status"]="live";r["live_at"]=now;r["last_verified_lifecycle"]="live";r["health_status"]=proof.get("health_status");r["youtube_api_verification_uncertain"]=False
          rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/youtube-stations.json control/live-results/8cf99db8-3e53-4b74-b9d2-51fb67b54ff8.json control/diagnostics/deep-house-transition-live.json
          git commit -m "youtube: transition Deep House broadcast live"
          git pull --rebase origin main
          git push origin HEAD:main
