name: Patch Office Music Release Master

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-release-master.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire GitHub Release master into publish and live workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          master = 'https://github.com/thebusinessflowtv/theofficemusic/releases/download/office-assets-v1/office-music-master-loop.mp4'
          files = [
              Path('.github/workflows/office-music-publish.yml'),
              Path('.github/workflows/office-music-live.yml'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              old = '          LOOP_URL: ${{ inputs.loop_url }}'
              new = f'          LOOP_URL: {master}'
              if old in s:
                  s = s.replace(old, new)
              elif new not in s:
                  raise SystemExit(f'Could not locate LOOP_URL mapping in {p}')
              p.write_text(s, encoding='utf-8')
              print(f'Patched {p}')
          PY

      - name: Validate master release asset metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url='https://api.github.com/repos/thebusinessflowtv/theofficemusic/releases/tags/office-assets-v1'
          req=urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','User-Agent':'office-music-ci'})
          with urllib.request.urlopen(req, timeout=30) as r:
              release=json.load(r)
          asset=next((a for a in release.get('assets',[]) if a.get('name')=='office-music-master-loop.mp4'),None)
          if not asset:
              raise SystemExit('Release asset office-music-master-loop.mp4 not found')
          if asset.get('state')!='uploaded':
              raise SystemExit(f"Release asset state is {asset.get('state')}")
          if int(asset.get('size') or 0) != 517903191:
              raise SystemExit(f"Unexpected master size: {asset.get('size')}")
          print('Release master metadata OK:', asset['browser_download_url'])
          PY

      - name: Commit workflow integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/office-music-publish.yml .github/workflows/office-music-live.yml
          if git diff --cached --quiet; then
            echo 'Release master is already wired.'
            exit 0
          fi
          git commit -m 'fix: use GitHub Release master visual for Office Music'
          git pull --rebase origin main
          git push origin HEAD:main
