name: YouTube Owner File Details Export

on:
  push:
    paths:
      - 'control/youtube-filedetails-queue/*.json'

permissions:
  contents: write

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python -m pip install -q google-api-python-client google-auth google-auth-httplib2
      - name: Export owner-only details
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILE="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '^control/youtube-filedetails-queue/[^/]+\.json$' | tail -1)"
          VIDEO_ID="$(jq -r '.video_id' "$FILE")"
          export VIDEO_ID
          mkdir -p control/youtube-filedetails
          python - <<'PY'
          import json, os, pathlib
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          vid=os.environ['VIDEO_ID']
          items=yt.videos().list(part='snippet,status,contentDetails,fileDetails,processingDetails',id=vid).execute().get('items',[])
          if not items: raise SystemExit('video not found')
          pathlib.Path(f'control/youtube-filedetails/{vid}.json').write_text(json.dumps(items[0],ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add "control/youtube-filedetails/${VIDEO_ID}.json"
          git commit -m "mediaforge: export owner file details ${VIDEO_ID}"
          git push origin HEAD:main
