name: Office Music — Live

on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
      track_urls_b64:
        required: true
        type: string
      duration_minutes:
        description: "0 = continuous chained live"
        required: true
        default: "60"
        type: string
      title:
        required: true
        default: "Peter Lofi Radio — Live"
        type: string
      description:
        required: false
        default: ""
        type: string
      thumbnail_url:
        required: false
        default: ""
        type: string
      loop_url:
        required: false
        default: ""
        type: string
      resume_broadcast_id:
        required: false
        default: ""
        type: string
      resume_stream_id:
        required: false
        default: ""
        type: string
      segment_index:
        required: true
        default: "1"
        type: string
      privacy_status:
        description: "public, unlisted or private"
        required: false
        default: "public"
        type: string
      segment_seconds_override:
        description: "Test only. 0 = normal production segment."
        required: false
        default: "0"
        type: string
      prewarm_lead_seconds:
        description: "How early the successor runner is prepared."
        required: false
        default: "900"
        type: string
      max_segments:
        description: "0 = unlimited"
        required: false
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: office-music-live-${{ inputs.session_id }}-${{ inputs.segment_index }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GH_STREAM_CONTROL_TOKEN || github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

      SESSION_ID: ${{ inputs.session_id }}
      TRACK_URLS_B64: ${{ inputs.track_urls_b64 }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
      TITLE: ${{ inputs.title }}
      DESCRIPTION: ${{ inputs.description }}
      THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
      LOOP_URL: ${{ inputs.loop_url }}
      RESUME_BROADCAST_ID: ${{ inputs.resume_broadcast_id }}
      RESUME_STREAM_ID: ${{ inputs.resume_stream_id }}
      SEGMENT_INDEX: ${{ inputs.segment_index }}
      PRIVACY_STATUS: ${{ inputs.privacy_status }}
      SEGMENT_SECONDS_OVERRIDE: ${{ inputs.segment_seconds_override }}
      PREWARM_LEAD_SECONDS: ${{ inputs.prewarm_lead_seconds }}
      MAX_SEGMENTS: ${{ inputs.max_segments }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install live runtime
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg file
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth google-auth-httplib2 cryptography

      - name: Run continuity-first YouTube live segment
        run: |
          set -euo pipefail
          python scripts/mediaforge_live_segment_v7.py
