name: One-off — Recreate Rainy YouTube Live

on:
  push:
    paths:
      - '.github/workflows/oneoff-recover-rainy-youtube-new.yml'

permissions:
  contents: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GH_STREAM_CONTROL_TOKEN || github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      SOURCE_QUEUE: control/youtube-live-queue/fe6e6fd3-fd9c-4265-b12d-8eb50c0b52fc.json
      RECOVERY_SESSION_ID: 72fcb955-bbb3-41d1-b8d0-fd90427c57a5
      CORRECT_LOOP_URL: https://mediaforge-api.guilhermeodsgn.workers.dev/media/998ca654-bb42-4c35-99c6-04ac2ebad84c/b6bf0c5819a04630b36f61314ed6de7566e4b48b72df41c59093a5bd7c0f9ab0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v file >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg file
          fi
          python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2 cryptography

      - name: Restore exact Rainy configuration for a new broadcast
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          q=json.load(open(os.environ['SOURCE_QUEUE'], encoding='utf-8'))
          queue_loop=str(q.get('loop_url') or '')
          correct=os.environ['CORRECT_LOOP_URL']
          if queue_loop != correct:
              raise SystemExit(f'Refusing wrong Rainy video: {queue_loop}')
          values={
              'SESSION_ID': os.environ['RECOVERY_SESSION_ID'],
              'TRACK_URLS_B64': str(q['track_urls_b64']),
              'DURATION_MINUTES': '0',
              'TITLE': str(q.get('title') or 'Rainy Late Night Office 🌧️ LIVE | Lofi for Deep Focus, Work & Study — Peter Lofi'),
              'DESCRIPTION': str(q.get('description') or ''),
              'THUMBNAIL_URL': str(q.get('thumbnail_url') or ''),
              'LOOP_URL': correct,
              'RESUME_BROADCAST_ID': '',
              'RESUME_STREAM_ID': '',
              'SEGMENT_INDEX': '1',
              'PRIVACY_STATUS': 'public',
              'SEGMENT_SECONDS_OVERRIDE': '0',
              'PREWARM_LEAD_SECONDS': '900',
              'MAX_SEGMENTS': '0',
          }
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key,val in values.items():
                  if '\n' in val or '\r' in val:
                      marker=f'__MEDIAFORGE_{key}__'
                      f.write(f'{key}<<{marker}\n{val}\n{marker}\n')
                  else:
                      f.write(f'{key}={val}\n')
          print('RAINY_VIDEO_CONFIRMED=' + correct)
          print('Old Rainy broadcast is complete; creating a new public broadcast with exact persisted config.')
          PY

      - name: Create and start Rainy with V7
        run: |
          set -euo pipefail
          python scripts/mediaforge_live_segment_v7.py
# retrigger 2026-10-02T20:35:57.249Z — restore YouTube live after OVH migration
