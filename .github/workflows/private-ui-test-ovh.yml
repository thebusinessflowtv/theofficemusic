name: One-off — Peter Lofi Private Figma UI Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-ui-test-ovh.yml"

permissions:
  contents: write

jobs:
  launch:
    if: ${{ !contains(github.event.head_commit.message, 'ui-test: scrub temporary asset URLs') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_API: "https://mediaforge-api.guilhermeodsgn.workers.dev"
      BACKGROUND_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/cc2cc51a-a0aa-4124-b3ef-1cfd36f68b99.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYzc5ZWUwMjJiMGNhZjQzZSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE5OTY1MH0.0Of7xxmkCWjachDXPpbJ5v65KQqcCes8EMXcZHBTISg"
      FIGMA_HEADER_URL: "https://www.figma.com/api/mcp/asset/9b984381-7204-411b-8ca4-6c962a86ef4b.png"
      FIGMA_WEB_URL: "https://www.figma.com/api/mcp/asset/ed5a1171-da3e-4ca0-aef0-8ad01b2dd41c.png"
      FIGMA_ICON_URL: "https://www.figma.com/api/mcp/asset/16caff52-d625-4f7d-a507-d8449cd3e8e1.png"
      FONT_CARRIER_URL: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/54a8230c-f6b0-44a2-a9c0-bc50922357dd.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTJlODQ5Yzg3Yzc1NDg0MCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTE5OTQzMn0._Bgq4Ra_ldOKyE2aedUNud21pdENPnn0coFvDY98LvU"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate updated OVH runtime code
        run: |
          set -euo pipefail
          python -m py_compile             ovh-streaming/app/audio_engine.py             ovh-streaming/app/visual_engine.py             ovh-streaming/app/stream_core.py             ovh-streaming/app/ovh_agent.py

      - name: Update only the OVH control agent
        shell: bash
        run: |
          set -euo pipefail
          BODY='{"action":"deploy_service","target":"ovh-agent"}'
          curl -fsS -X POST "$BASE_API/api/ovh/deploy-agent/commands"             -H "content-type: application/json" --data "$BODY" > /tmp/deploy.json           || curl -fsS -X POST "$BASE_API/api/ovh/deploy-agent/command"             -H "content-type: application/json" --data "$BODY" > /tmp/deploy.json
          cat /tmp/deploy.json

          echo "Waiting for the refreshed agent to advertise youtube-ui-test..."
          for I in $(seq 1 60); do
            if curl -fsS "$BASE_API/api/ovh/public-health" > /tmp/health.json 2>/dev/null; then
              if jq -e '.services["youtube-ui-test"]' /tmp/health.json >/dev/null 2>&1; then
                jq '.services["youtube-ui-test"]' /tmp/health.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Updated OVH agent did not appear in public health."
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Install YouTube API client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Create private YouTube broadcast and queue isolated OVH test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json, os, pathlib
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          root=pathlib.Path(".")
          now=dt.datetime.now(dt.timezone.utc)
          sid="figma-ui-test-"+now.strftime("%Y%m%d-%H%M%S")

          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)

          stream=yt.liveStreams().insert(
              part="snippet,cdn,contentDetails",
              body={
                  "snippet":{"title":"Peter Lofi — Figma UI Test Stream"},
                  "cdn":{
                      "frameRate":"30fps",
                      "ingestionType":"rtmp",
                      "resolution":"1080p",
                  },
                  "contentDetails":{"isReusable":False},
              },
          ).execute()
          stream_id=stream["id"]
          info=(stream.get("cdn") or {}).get("ingestionInfo") or {}
          stream_url=info.get("rtmpsIngestionAddress") or info.get("ingestionAddress")
          stream_key=info.get("streamName")
          if not stream_url or not stream_key:
              raise RuntimeError("YouTube did not return RTMP ingestion credentials")

          broadcast=yt.liveBroadcasts().insert(
              part="snippet,status,contentDetails",
              body={
                  "snippet":{
                      "title":"Peter Lofi — Figma Interactive Layout Test",
                      "description":"Private test of the Peter Lofi interactive live layout and now-playing system.",
                      "categoryId":"10",
                      "scheduledStartTime":(now+dt.timedelta(seconds=25)).isoformat(),
                  },
                  "status":{
                      "privacyStatus":"private",
                      "selfDeclaredMadeForKids":False,
                  },
                  "contentDetails":{
                      "enableAutoStart":True,
                      "enableAutoStop":False,
                      "monitorStream":{"enableMonitorStream":False},
                  },
              },
          ).execute()
          bid=broadcast["id"]
          yt.liveBroadcasts().bind(part="id,contentDetails",id=bid,streamId=stream_id).execute()

          playlist=json.loads((root/"ovh-streaming/stations/youtube-deep-house.json").read_text(encoding="utf-8"))
          tracks=playlist.get("tracks") or []
          if not tracks:
              raise RuntimeError("Deep House test playlist is empty")

          cmd_id="start-"+sid
          cmd={
              "id":cmd_id,
              "action":"start",
              "runtime":"ovh",
              "runtime_slot":"youtube-ui-test",
              "platform":"youtube",
              "session_id":sid,
              "title":"Peter Lofi — Figma Interactive Layout Test",
              "stream_url":stream_url,
              "stream_key":stream_key,
              "loop_url":os.environ["BACKGROUND_URL"],
              "header_url":os.environ["FIGMA_HEADER_URL"],
              "web_url":os.environ["FIGMA_WEB_URL"],
              "icon_url":os.environ["FIGMA_ICON_URL"],
              "font_carrier_url":os.environ["FONT_CARRIER_URL"],
              "playlist_key":"deep-house-radio-test",
              "tracks":tracks,
              "shuffle":True,
              "repeat":True,
              "requested_at":now.isoformat(),
              "source":"figma-private-ui-test",
          }

          cmd_path=root/f"control/ovh-commands/{cmd_id}.json"
          cmd_path.parent.mkdir(parents=True,exist_ok=True)
          cmd_path.write_text(json.dumps(cmd,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          idx_path=root/"control/ovh-commands/index.json"
          idx=json.loads(idx_path.read_text(encoding="utf-8")) if idx_path.exists() else {"version":1,"commands":[]}
          rel=str(cmd_path).replace("\\","/")
          commands=[x for x in idx.get("commands",[]) if str(x.get("id"))!=cmd_id]
          commands.append({"id":cmd_id,"path":rel,"created_at":now.isoformat()})
          idx.update({"version":1,"updated_at":now.isoformat(),"commands":commands[-500:]})
          idx_path.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          diag={
              "status":"queued",
              "privacy_status":"private",
              "session_id":sid,
              "runtime_slot":"youtube-ui-test",
              "youtube_broadcast_id":bid,
              "youtube_stream_id":stream_id,
              "youtube_url":f"https://www.youtube.com/watch?v={bid}",
              "figma_nodes":["32:5","38:190"],
              "layout":{
                  "latest_subscriptions_header":[59,54,448,160],
                  "subscriber_rows_y":[240,275,310],
                  "current_music":[110,869],
                  "vote_text":[1506,1020],
                  "paid_message":[588,459.522],
              },
              "created_at":now.isoformat(),
          }
          diag_path=root/"control/diagnostics/private-ui-test.json"
          diag_path.parent.mkdir(parents=True,exist_ok=True)
          diag_path.write_text(json.dumps(diag,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"UI_SESSION_ID={sid}\n")
              fh.write(f"UI_BROADCAST_ID={bid}\n")
              fh.write(f"UI_STREAM_ID={stream_id}\n")
              fh.write(f"UI_YOUTUBE_URL=https://www.youtube.com/watch?v={bid}\n")
          print(f"Private broadcast prepared: https://www.youtube.com/watch?v={bid}")
          PY

      - name: Publish the OVH start command
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/ovh-commands control/diagnostics/private-ui-test.json
          git commit -m "ui-test: launch isolated private YouTube Figma live"
          for N in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((N*2))
          done
          exit 1

      - name: Validate OVH publisher and now-playing
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for I in $(seq 1 60); do
            if curl -fsS "$BASE_API/api/ovh/public-health" > /tmp/ui-health.json 2>/dev/null; then
              STATUS="$(jq -r '.services["youtube-ui-test"].status // empty' /tmp/ui-health.json)"
              SONG="$(jq -r '.services["youtube-ui-test"].now_playing.title // .services["youtube-ui-test"].now_playing.name // empty' /tmp/ui-health.json)"
              echo "youtube-ui-test status=$STATUS now_playing=$SONG"
              if [ "$STATUS" = "live" ] && [ -n "$SONG" ]; then
                READY=1
                break
              fi
            fi
            sleep 5
          done
          [ "$READY" = "1" ]
          jq '.services["youtube-ui-test"]' /tmp/ui-health.json

      - name: Validate private YouTube live
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)
          bid=os.environ["UI_BROADCAST_ID"]
          final=None
          for _ in range(60):
              res=yt.liveBroadcasts().list(part="snippet,status",id=bid).execute()
              items=res.get("items") or []
              if not items:
                  raise RuntimeError("Private broadcast disappeared")
              b=items[0]
              final={
                  "lifeCycleStatus":(b.get("status") or {}).get("lifeCycleStatus"),
                  "privacyStatus":(b.get("status") or {}).get("privacyStatus"),
                  "title":(b.get("snippet") or {}).get("title"),
              }
              print(final)
              if final["lifeCycleStatus"]=="live" and final["privacyStatus"]=="private":
                  break
              time.sleep(5)
          else:
              raise RuntimeError(f"YouTube did not become live/private: {final}")
          pathlib=None
          with open("/tmp/youtube-status.json","w",encoding="utf-8") as fh:
              json.dump(final,fh,ensure_ascii=False,indent=2)
          PY

      - name: Persist final proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, datetime as dt
          p=pathlib.Path("control/diagnostics/private-ui-test.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          h=json.loads(pathlib.Path("/tmp/ui-health.json").read_text(encoding="utf-8"))
          y=json.loads(pathlib.Path("/tmp/youtube-status.json").read_text(encoding="utf-8"))
          service=(h.get("services") or {}).get("youtube-ui-test") or {}
          d.update({
              "status":"live",
              "verified_at":dt.datetime.now(dt.timezone.utc).isoformat(),
              "youtube_status":y,
              "ovh_status":{
                  "status":service.get("status"),
                  "fps":service.get("fps"),
                  "video_bitrate_kbps":service.get("video_bitrate_kbps"),
                  "now_playing":service.get("now_playing"),
                  "audio_status":service.get("audio_status"),
                  "visual_status":service.get("visual_status"),
              },
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git add control/diagnostics/private-ui-test.json
          git commit -m "ui-test: verify private Figma YouTube live"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Scrub temporary Figma/asset URLs from the one-off workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/private-ui-test-ovh.yml")
          s=p.read_text(encoding="utf-8")
          for key in ["BACKGROUND_URL","FIGMA_HEADER_URL","FIGMA_WEB_URL","FIGMA_ICON_URL","FONT_CARRIER_URL"]:
              import re
              s=re.sub(rf'({key}: )"[^"]*"', rf'\1""', s)
          p.write_text(s,encoding="utf-8")
          PY
          git add .github/workflows/private-ui-test-ovh.yml
          git commit -m "ui-test: scrub temporary asset URLs"
          git pull --rebase origin main
          git push origin HEAD:main
