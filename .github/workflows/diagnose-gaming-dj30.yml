name: Diagnose Gaming GPU allocation
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-gaming-dj30.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - run: python -m pip install kaggle==2.2.4
      - name: Inspect quota and assigned hardware metadata
        run: |
          set -euo pipefail
          kaggle quota
          mkdir -p /tmp/kernel-meta
          kaggle kernels pull "$KAGGLE_USERNAME/peter-lofi-dj30-1-37175734843-1" -m -p /tmp/kernel-meta
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('/tmp/kernel-meta/kernel-metadata.json').read_text())
          print(json.dumps({k:d.get(k) for k in ('enable_gpu','machine_shape','enable_internet','docker_image','docker_image_pinning_type')}))
          PY
