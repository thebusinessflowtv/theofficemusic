name: Verify Kaggle GPU before music generation
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-gaming-dj30.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        accelerator: [NvidiaL4X1, NvidiaTeslaT4]
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      ACCELERATOR: ${{ matrix.accelerator }}
    steps:
      - run: python -m pip install kaggle==2.2.4
      - name: Run real GPU preflight
        run: |
          set -euo pipefail
          mkdir -p /tmp/gpu-probe
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('/tmp/gpu-probe')
          name='dj30-gpu-'+os.environ['ACCELERATOR'].lower()+'-'+os.environ['GITHUB_RUN_ID']
          (p/'runner.py').write_text('import subprocess,json,pathlib\nimport torch\nr=subprocess.run(["nvidia-smi"],capture_output=True,text=True)\nprint(r.stdout,r.stderr)\nd={"cuda":torch.cuda.is_available(),"count":torch.cuda.device_count(),"torch":torch.__version__}\nif d["cuda"]: d.update(name=torch.cuda.get_device_name(0),capability=torch.cuda.get_device_capability(0))\nprint(json.dumps(d))\npathlib.Path("/kaggle/working/gpu.json").write_text(json.dumps(d))\nassert d["cuda"],"No CUDA GPU assigned"\n')
          (p/'kernel-metadata.json').write_text(json.dumps({'id':os.environ['KAGGLE_USERNAME']+'/'+name,'title':name,'code_file':'runner.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':True,'enable_internet':True,'machine_shape':os.environ['ACCELERATOR'],'dataset_sources':[],'competition_sources':[],'kernel_sources':[]}))
          PY
          kaggle kernels push -p /tmp/gpu-probe --accelerator "$ACCELERATOR" --timeout 600 | tee /tmp/push.log
          REF="$(python -c 'import re; print(re.search(r"https://www[.]kaggle[.]com/code/([A-Za-z0-9_-]+/[A-Za-z0-9_-]+)",open("/tmp/push.log").read()).group(1))')"
          for n in $(seq 1 50); do
            STATUS="$(kaggle kernels status "$REF")"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|error|failed|cancel'; then break; fi
            sleep 15
          done
          kaggle kernels logs "$REF"
          kaggle kernels output "$REF" -p /tmp/probe-output
          cat /tmp/probe-output/gpu.json
