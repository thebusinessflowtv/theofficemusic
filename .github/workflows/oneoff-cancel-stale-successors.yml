name: One-off — Cancel Stale Successors After Recovery

on:
  push:
    paths:
      - '.github/workflows/oneoff-cancel-stale-successors.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale pre-recovery successor runs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for RUN_ID in 37018389157 37018392345; do
            echo "Cancelling stale successor run $RUN_ID"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
          done
