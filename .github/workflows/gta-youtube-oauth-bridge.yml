name: MediaForge — GTA VI YouTube OAuth Bridge

on:
  push:
    branches: [main]
    paths:
      - 'control/gta-youtube-launch/*.json'

permissions:
  contents: write
  id-token: write

concurrency:
  group: gta-youtube-oauth-bridge
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve GTA live request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"

          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            CHANGED="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          else
            CHANGED="$(git diff-tree --no-commit-id --name-only -r "$AFTER_SHA")"
          fi
          FILE="$(printf '%s\n' "$CHANGED" | grep -E '^control/gta-youtube-launch/[^/]+\.json$' | tail -1)"
          test -s "$FILE"
          jq -e . "$FILE" >/dev/null

          python - "$FILE" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          required=["session_id","title","description","loop_url","thumbnail_url"]
          for k in required:
              if not d.get(k):
                  raise SystemExit(f"Missing {k}")
          vals={
              "SESSION_ID":d["session_id"],
              "LIVE_TITLE":d["title"],
              "LIVE_DESCRIPTION":d["description"],
              "LOOP_URL":d["loop_url"],
              "THUMBNAIL_URL":d["thumbnail_url"],
          }
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              for key,val in vals.items():
                  marker="MF_"+key+"_EOF"
                  fh.write(f"{key}<<{marker}\n{val}\n{marker}\n")
          PY

      - name: Install YouTube client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Validate GitHub OIDC with OVH before creating broadcast
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mediaforge-ovh")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          test -n "$OIDC_TOKEN"
          CODE="$(curl -ksS -o /tmp/oidc-preflight.json -w '%{http_code}' -X POST             "https://146.59.156.224:8443/api/ovh/github-youtube-bootstrap"             -H "authorization: Bearer $OIDC_TOKEN"             -H 'content-type: application/json'             --data '{"runtime_slot":"youtube-gta-vi"}')"
          echo "OIDC_PREFLIGHT_HTTP=$CODE"
          cat /tmp/oidc-preflight.json
          test "$CODE" = "400"
          jq -e '.error=="youtube_ingest_required"' /tmp/oidc-preflight.json >/dev/null
          echo "OIDC_PREFLIGHT_OK"

      - name: Create public GTA VI broadcast and prepare OVH command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json, os, pathlib, ssl, urllib.request
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          root=pathlib.Path(".")
          sid=os.environ["SESSION_ID"]
          stations_path=root/"control/youtube-stations.json"
          cfg=json.loads(stations_path.read_text(encoding="utf-8"))
          station=next((x for x in cfg.get("stations",[]) if x.get("ovh_slot")=="youtube-gta-vi"),None)
          if not station:
              raise SystemExit("youtube-gta-vi station missing")

          library=json.loads((root/"control/music-library.json").read_text(encoding="utf-8"))
          playlist=next((p for p in library.get("playlists",[]) if p.get("key")=="gta-vi-vice-city"),None)
          if not playlist:
              raise SystemExit("GTA VI playlist missing")
          tracks=[{
              "id":str(t.get("id") or ""),
              "title":str(t.get("title") or "Track"),
              "url":str(t.get("url") or ""),
              "duration_seconds":float(t.get("duration_seconds") or 300),
              "position":t.get("position"),
              "target_bpm":t.get("target_bpm"),
          } for t in (playlist.get("tracks") or []) if t.get("id") and t.get("url")]
          if not tracks:
              raise SystemExit("GTA VI playlist has no playable tracks")

          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)

          channel_items=yt.channels().list(part="id,snippet",mine=True,maxResults=1).execute().get("items") or []
          if not channel_items:
              raise SystemExit("No YouTube channel found for authenticated Peter Lofi OAuth")
          channel_title=str((channel_items[0].get("snippet") or {}).get("title") or "")
          print("Authenticated YouTube channel:",channel_title)
          if "peter" not in channel_title.lower():
              raise SystemExit("OAuth belongs to the wrong YouTube channel: "+channel_title)

          stream=None
          stream_id=str(station.get("youtube_stream_id") or "")
          if stream_id:
              items=yt.liveStreams().list(part="id,snippet,cdn,status,contentDetails",id=stream_id).execute().get("items") or []
              stream=items[0] if items else None
          if not stream:
              stream=yt.liveStreams().insert(
                  part="snippet,cdn,contentDetails",
                  body={
                      "snippet":{"title":"Peter Lofi — GTA VI Vice City Radio"},
                      "cdn":{"frameRate":"60fps","ingestionType":"rtmp","resolution":"1080p"},
                      "contentDetails":{"isReusable":True},
                  },
              ).execute()
              stream_id=str(stream["id"])
              station["youtube_stream_id"]=stream_id
              station["stream_provisioned_at"]=dt.datetime.now(dt.timezone.utc).isoformat()

          info=(stream.get("cdn") or {}).get("ingestionInfo") or {}
          stream_url=str(info.get("rtmpsIngestionAddress") or info.get("ingestionAddress") or "")
          stream_key=str(info.get("streamName") or "")
          if not stream_url or not stream_key:
              raise SystemExit("YouTube ingest credentials unavailable")

          now=dt.datetime.now(dt.timezone.utc)
          broadcast=yt.liveBroadcasts().insert(
              part="snippet,status,contentDetails",
              body={
                  "snippet":{
                      "title":os.environ["LIVE_TITLE"][:100],
                      "description":os.environ["LIVE_DESCRIPTION"][:5000],
                      "categoryId":"10",
                      "scheduledStartTime":(now+dt.timedelta(seconds=20)).isoformat(),
                  },
                  "status":{"privacyStatus":"public","selfDeclaredMadeForKids":False},
                  "contentDetails":{
                      "enableAutoStart":True,
                      "enableAutoStop":False,
                      "monitorStream":{"enableMonitorStream":False},
                  },
              },
          ).execute()
          bid=str(broadcast["id"])
          yt.liveBroadcasts().bind(part="id,contentDetails",id=bid,streamId=stream_id).execute()

          thumb_ok=False
          try:
              ctx=ssl.create_default_context()
              data=urllib.request.urlopen(
                  urllib.request.Request(os.environ["THUMBNAIL_URL"],headers={"User-Agent":"MediaForge-GTA-Bridge"}),
                  timeout=90,context=ctx
              ).read()
              p=pathlib.Path("/tmp/gta-thumb")
              p.write_bytes(data)
              yt.thumbnails().set(videoId=bid,media_body=MediaFileUpload(str(p),resumable=False)).execute()
              thumb_ok=True
          except Exception as exc:
              print(f"::warning::Thumbnail upload skipped: {exc}")

          command={
              "action":"start",
              "platform":"youtube",
              "runtime_slot":"youtube-gta-vi",
              "session_id":sid,
              "title":os.environ["LIVE_TITLE"],
              "description":os.environ["LIVE_DESCRIPTION"],
              "duration_minutes":0,
              "loop_url":os.environ["LOOP_URL"],
              "playlist_key":"gta-vi-vice-city",
              "tracks":tracks,
              "shuffle":True,
              "repeat":True,
              "stream_url":stream_url,
              "stream_key":stream_key,
              "source":"github-youtube-oauth-bridge",
          }
          pathlib.Path("/tmp/gta-ovh-command.json").write_text(json.dumps(command,separators=(",",":")),encoding="utf-8")

          result={
              "platform":"youtube",
              "runtime":"ovh",
              "runtime_slot":"youtube-gta-vi",
              "status":"starting",
              "title":os.environ["LIVE_TITLE"],
              "description":os.environ["LIVE_DESCRIPTION"],
              "youtube_broadcast_id":bid,
              "youtube_stream_id":stream_id,
              "youtube_url":f"https://www.youtube.com/watch?v={bid}",
              "privacy_status":"public",
              "playlist_key":"gta-vi-vice-city",
              "playlist_track_count":len(tracks),
              "custom_thumbnail_applied":thumb_ok,
              "created_at":now.isoformat(),
              "updated_at":now.isoformat(),
          }
          out=root/f"control/live-results/{sid}.json"
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          station.update({
              "runtime":"ovh",
              "status":"starting",
              "current_session_id":sid,
              "youtube_broadcast_id":bid,
              "youtube_stream_id":stream_id,
              "last_started_at":now.isoformat(),
          })
          cfg["updated_at"]=now.isoformat()
          stations_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"YOUTUBE_BROADCAST_ID={bid}\n")
              fh.write(f"YOUTUBE_STREAM_ID={stream_id}\n")
              fh.write(f"YOUTUBE_URL=https://www.youtube.com/watch?v={bid}\n")
          print("YouTube broadcast prepared for OVH GTA runtime")
          PY

      - name: Send start command to OVH using GitHub Actions OIDC
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mediaforge-ovh")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          test -n "$OIDC_TOKEN"

          BOOT_CODE="$(curl -ksS -o /tmp/ovh-bootstrap.json -w '%{http_code}' -X POST "https://146.59.156.224:8443/api/ovh/github-youtube-bootstrap"             -H "authorization: Bearer $OIDC_TOKEN"             -H 'content-type: application/json'             --data-binary @/tmp/gta-ovh-command.json)"
          echo "OVH_BOOTSTRAP_HTTP=$BOOT_CODE"
          cat /tmp/ovh-bootstrap.json
          test "$BOOT_CODE" = "202"
          jq '{ok,authenticated_repository,runtime_slot,playlist_key,playlist_track_count,command}' /tmp/ovh-bootstrap.json
          jq -e '.ok==true' /tmp/ovh-bootstrap.json >/dev/null
          rm -f /tmp/gta-ovh-command.json
          echo "GTA_OVH_COMMAND_QUEUED_VIA_OIDC"

      - name: Publish sanitized YouTube state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "control/live-results/$SESSION_ID.json" control/youtube-stations.json
          git commit -m "youtube: launch GTA VI OVH live $SESSION_ID"
          for N in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((N*2))
          done
          exit 1

      - name: Confirm GTA publisher becomes live
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for I in $(seq 1 90); do
            if curl -kfsS "https://146.59.156.224:8443/api/ovh/public-health" >/tmp/health.json 2>/dev/null; then
              STATUS="$(jq -r '.services["youtube-gta-vi"].status // empty' /tmp/health.json)"
              SONG="$(jq -r '.services["youtube-gta-vi"].now_playing.title // empty' /tmp/health.json)"
              echo "gta_status=$STATUS now_playing=$SONG"
              if [ "$STATUS" = "live" ] && [ -n "$SONG" ]; then
                READY=1
                break
              fi
            fi
            sleep 5
          done
          test "$READY" = "1"
          echo "GTA_YOUTUBE_OVH_LIVE"
