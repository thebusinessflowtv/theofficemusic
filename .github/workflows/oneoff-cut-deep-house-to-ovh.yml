name: One-off — Cut Deep House to OVH

on:
  push:
    paths:
      - '.github/workflows/oneoff-cut-deep-house-to-ovh.yml'

permissions:
  contents: write
  actions: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      SESSION_ID: 8cf99db8-3e53-4b74-b9d2-51fb67b54ff8
      RUN_ID_OLD: "37061628366"
    steps:
      - uses: actions/checkout@v4

      - run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Stop old Deep House GitHub encoder
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID_OLD}/cancel" || true

      - name: Verify OVH takeover
        run: |
          sleep 75
          python - <<'PY'
          import json,os,time
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          session=os.environ['SESSION_ID']
          res=json.load(open(f'control/live-results/{session}.json',encoding='utf-8'))
          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          creds.refresh(Request()); yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          sid=res['youtube_stream_id']; bid=res['youtube_broadcast_id']
          for attempt in range(1,4):
              s=(yt.liveStreams().list(part='status',id=sid).execute().get('items') or [None])[0]
              b=(yt.liveBroadcasts().list(part='status',id=bid).execute().get('items') or [None])[0]
              st=(s or {}).get('status') or {}; hs=st.get('healthStatus') or {}
              lifecycle=((b or {}).get('status') or {}).get('lifeCycleStatus')
              issues=hs.get('configurationIssues') or []
              starved=any(str(i.get('type') or '')=='videoIngestionStarved' for i in issues)
              bad_secondary=any(str(i.get('type') or '') in {'typeUnspecified','framerateMismatch'} for i in issues)
              ok=st.get('streamStatus')=='active' and lifecycle=='live' and not starved and not bad_secondary
              print('attempt',attempt,'stream=',st.get('streamStatus'),'lifecycle=',lifecycle,'health=',hs.get('status'),'ok=',ok,flush=True)
              if ok:
                  print('DEEP_HOUSE_OVH_TAKEOVER_CONFIRMED')
                  raise SystemExit(0)
              time.sleep(30)
          raise SystemExit('Deep House OVH takeover did not validate')
          PY
