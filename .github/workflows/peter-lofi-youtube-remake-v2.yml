name: Peter Lofi — YouTube Visual Remake V2

on:
  push:
    paths:
      - 'control/youtube-remake-v2-queue/*.json'

permissions:
  contents: write

concurrency:
  group: peter-lofi-youtube-remake-v2
  cancel-in-progress: false

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

jobs:
  remake:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve request
        id: request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILE="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '^control/youtube-remake-v2-queue/[^/]+\.json$' | tail -1 || true)"
          test -n "$FILE" || { echo '::error::No YouTube remake queue file found'; exit 1; }
          jq -e . "$FILE" >/dev/null
          OLD_VIDEO_ID="$(jq -r '.old_video_id // empty' "$FILE")"
          LOOP_URL="$(jq -r '.loop_url // empty' "$FILE")"
          test -n "$OLD_VIDEO_ID" || exit 1
          test -n "$LOOP_URL" || exit 1
          [[ "$OLD_VIDEO_ID" =~ ^[A-Za-z0-9_-]{11}$ ]] || exit 1
          [[ "$LOOP_URL" =~ ^https:// ]] || exit 1
          echo "old_video_id=$OLD_VIDEO_ID" >> "$GITHUB_OUTPUT"
          echo "loop_url=$LOOP_URL" >> "$GITHUB_OUTPUT"

      - name: Prepare runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg jq
          fi
          python -m pip install --user -q 'yt-dlp>=2026.8.19' google-api-python-client google-auth google-auth-httplib2
          mkdir -p build/audio-download control/youtube-remakes
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Fetch original metadata from authenticated YouTube API
        env:
          OLD_VIDEO_ID: ${{ steps.request.outputs.old_video_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          mine=yt.channels().list(part='id',mine=True).execute().get('items',[])
          if not mine: raise SystemExit('No authenticated YouTube channel')
          channel_id=mine[0]['id']
          expected=os.environ.get('YOUTUBE_CHANNEL_ID','').strip()
          if expected and expected != channel_id: raise SystemExit('Authenticated YouTube channel mismatch')
          vid=os.environ['OLD_VIDEO_ID']
          items=yt.videos().list(part='snippet,status,contentDetails',id=vid).execute().get('items',[])
          if not items: raise SystemExit('Original video not found')
          v=items[0]
          if v['snippet'].get('channelId') != channel_id: raise SystemExit('Original video is not owned by this channel')
          pathlib.Path('build/original.json').write_text(json.dumps(v,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ORIGINAL_TITLE='+v['snippet'].get('title',''))
          print('ORIGINAL_PRIVACY='+v['status'].get('privacyStatus',''))
          print('ORIGINAL_DURATION='+v.get('contentDetails',{}).get('duration',''))
          print('ORIGINAL_PUBLISHED_AT='+v['snippet'].get('publishedAt',''))
          PY

      - name: Recover the original music with resilient YouTube clients
        env:
          OLD_VIDEO_ID: ${{ steps.request.outputs.old_video_id }}
        run: |
          set -euo pipefail
          URL="https://www.youtube.com/watch?v=${OLD_VIDEO_ID}"
          rm -f build/audio-download/source.*
          SUCCESS=0
          for CLIENT in web_embedded tv web_safari ios mweb; do
            echo "Trying YouTube player client: $CLIENT"
            rm -f build/audio-download/source.*
            set +e
            python -m yt_dlp --no-playlist --js-runtimes node \
              --extractor-args "youtube:player_client=${CLIENT}" \
              --retries 5 --fragment-retries 5 --extractor-retries 3 --socket-timeout 30 \
              -f 'bestaudio/best' -o 'build/audio-download/source.%(ext)s' "$URL"
            RC=$?
            set -e
            AUDIO="$(find build/audio-download -maxdepth 1 -type f -name 'source.*' | head -1 || true)"
            if [ "$RC" = 0 ] && [ -n "$AUDIO" ] && [ -s "$AUDIO" ]; then
              SUCCESS=1
              echo "Audio recovered with client: $CLIENT"
              break
            fi
          done
          if [ "$SUCCESS" != 1 ]; then
            echo '::error::All safe YouTube player-client fallbacks failed to recover the original audio.'
            exit 1
          fi
          ffmpeg -hide_banner -loglevel warning -stats -y -i "$AUDIO" -vn -c:a aac -b:a 256k -ar 48000 -ac 2 build/original-audio.m4a
          test -s build/original-audio.m4a
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 build/original-audio.m4a

      - name: Download and validate replacement visual
        env:
          LOOP_URL: ${{ steps.request.outputs.loop_url }}
        run: |
          set -euo pipefail
          curl --retry 8 --retry-delay 3 --retry-all-errors -fL "$LOOP_URL" -o build/loop-source.mp4
          test -s build/loop-source.mp4
          ffmpeg -hide_banner -v error -i build/loop-source.mp4 -map 0:v:0 -frames:v 1 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json build/loop-source.mp4

      - name: Normalize replacement visual to 4K loop master
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel warning -stats -y -i build/loop-source.mp4 -map 0:v:0 -an \
            -vf "scale=3840:2160:force_original_aspect_ratio=decrease:flags=lanczos,pad=3840:2160:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 20 -profile:v high -level:v 5.1 -g 60 -keyint_min 60 -sc_threshold 0 -movflags +faststart build/loop-4k.mp4
          test -s build/loop-4k.mp4

      - name: Assemble full-length remake
        run: |
          set -euo pipefail
          AUDIO_SECONDS="$(ffprobe -v error -show_entries format=duration -of csv=p=0 build/original-audio.m4a)"
          ffmpeg -hide_banner -loglevel warning -stats -y \
            -fflags +genpts -stream_loop -1 -i build/loop-4k.mp4 -i build/original-audio.m4a \
            -map 0:v:0 -map 1:a:0 -t "$AUDIO_SECONDS" -c:v copy -c:a copy -avoid_negative_ts make_zero -movflags +faststart build/peter-lofi-remake.mp4
          test -s build/peter-lofi-remake.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json build/peter-lofi-remake.mp4

      - name: Publish replacement, verify it, then privatize original
        env:
          OLD_VIDEO_ID: ${{ steps.request.outputs.old_video_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, time
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          original=json.loads(pathlib.Path('build/original.json').read_text(encoding='utf-8'))
          s=original['snippet']; old_status=original['status']; old_id=os.environ['OLD_VIDEO_ID']
          snippet={'title':s.get('title','')[:100],'description':s.get('description',''),'categoryId':s.get('categoryId','10')}
          for key in ('tags','defaultLanguage','defaultAudioLanguage'):
              if key in s: snippet[key]=s[key]
          body={'snippet':snippet,'status':{'privacyStatus':'public','selfDeclaredMadeForKids':bool(old_status.get('selfDeclaredMadeForKids',False))}}
          media=MediaFileUpload('build/peter-lofi-remake.mp4',mimetype='video/mp4',chunksize=32*1024*1024,resumable=True)
          req=yt.videos().insert(part='snippet,status',body=body,media_body=media)
          response=None
          while response is None:
              progress,response=req.next_chunk(num_retries=10)
              if progress: print('UPLOAD_PROGRESS=%d%%'%int(progress.progress()*100))
          new_id=response['id']; new_url='https://www.youtube.com/watch?v='+new_id
          print('NEW_VIDEO_URL='+new_url)
          verified=False
          for attempt in range(120):
              items=yt.videos().list(part='snippet,status,processingDetails,contentDetails',id=new_id).execute().get('items',[])
              if items:
                  nv=items[0]; st=nv.get('status',{}); pd=nv.get('processingDetails',{})
                  print('NEW_CHECK',attempt+1,st.get('privacyStatus'),st.get('uploadStatus'),pd.get('processingStatus'))
                  if st.get('privacyStatus')=='public' and st.get('uploadStatus') in ('uploaded','processed') and pd.get('processingStatus') not in ('failed','terminated'):
                      verified=True; break
              time.sleep(15)
          if not verified: raise SystemExit('Replacement uploaded but public verification failed; original remains unchanged')
          old_now=yt.videos().list(part='status',id=old_id).execute().get('items',[])
          if not old_now: raise SystemExit('Could not re-read original; leaving it unchanged')
          os0=old_now[0]['status']
          private={'privacyStatus':'private','selfDeclaredMadeForKids':bool(os0.get('selfDeclaredMadeForKids',False))}
          for k in ('embeddable','license','publicStatsViewable'):
              if k in os0: private[k]=os0[k]
          yt.videos().update(part='status',body={'id':old_id,'status':private}).execute()
          new_final=yt.videos().list(part='snippet,status,contentDetails',id=new_id).execute().get('items',[{}])[0]
          old_final=yt.videos().list(part='status',id=old_id).execute().get('items',[{}])[0]
          if new_final.get('status',{}).get('privacyStatus')!='public': raise SystemExit('Replacement is not public')
          if old_final.get('status',{}).get('privacyStatus')!='private': raise SystemExit('Original is not private')
          result={'status':'completed','old_video_id':old_id,'old_video_url':'https://www.youtube.com/watch?v='+old_id,'old_privacy':'private','new_video_id':new_id,'new_video_url':new_url,'new_privacy':'public','title':new_final.get('snippet',{}).get('title'),'description':new_final.get('snippet',{}).get('description'),'duration':new_final.get('contentDetails',{}).get('duration'),'source_title':s.get('title'),'source_description':s.get('description'),'title_identical':new_final.get('snippet',{}).get('title')==s.get('title'),'description_identical':new_final.get('snippet',{}).get('description')==s.get('description')}
          pathlib.Path('build/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Record completed remake
        if: success()
        env:
          OLD_VIDEO_ID: ${{ steps.request.outputs.old_video_id }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cp build/result.json "control/youtube-remakes/${OLD_VIDEO_ID}.json"
          git add "control/youtube-remakes/${OLD_VIDEO_ID}.json"
          git commit -m "mediaforge: record YouTube visual remake ${OLD_VIDEO_ID}" || exit 0
          git push origin HEAD:main
