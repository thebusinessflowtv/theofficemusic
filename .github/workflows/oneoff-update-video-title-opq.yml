name: One-off — Update Lounge House video title

on:
  push:
    paths:
      - '.github/workflows/oneoff-update-video-title-opq.yml'

permissions:
  contents: read

jobs:
  update-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install YouTube API client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Update title while preserving existing metadata
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_ID: OPqTdiiXPY0
          NEW_TITLE: "1 Hour Lounge House Mix ☕ Stylish Office Music for Work & Focus | Peter Lofi"
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube'],
          )
          creds.refresh(Request())
          yt = build('youtube', 'v3', credentials=creds, cache_discovery=False)

          video_id = os.environ['VIDEO_ID']
          new_title = os.environ['NEW_TITLE']
          resp = yt.videos().list(part='snippet', id=video_id).execute()
          items = resp.get('items', [])
          if not items:
              raise SystemExit(f'Video not found: {video_id}')

          snippet = dict(items[0]['snippet'])
          old_title = snippet.get('title', '')
          snippet['title'] = new_title
          allowed = {'title','description','tags','categoryId','defaultLanguage','defaultAudioLanguage'}
          snippet = {k: v for k, v in snippet.items() if k in allowed}

          yt.videos().update(part='snippet', body={'id': video_id, 'snippet': snippet}).execute()
          print(f'Updated {video_id}')
          print(f'OLD: {old_title}')
          print(f'NEW: {new_title}')
          PY
