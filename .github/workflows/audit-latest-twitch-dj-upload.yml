name: Audit Latest Twitch DJ Upload

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-latest-twitch-dj-upload.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and download latest Twitch DJ archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/archive.env
          import json,pathlib,shlex
          idx=json.loads(pathlib.Path("control/ovh-commands/index.json").read_text())
          for row in reversed(idx.get("commands",[])):
              p=pathlib.Path(row.get("path",""))
              if not p.is_file(): continue
              try: cmd=json.loads(p.read_text())
              except Exception: continue
              if cmd.get("action")=="import_twitch_dj_archive" and cmd.get("archive_url"):
                  print("COMMAND_ID="+shlex.quote(str(cmd.get("id",""))))
                  print("ARCHIVE_URL="+shlex.quote(str(cmd["archive_url"])))
                  print("ASSET_ID="+shlex.quote(str(cmd.get("archive_asset_id",""))))
                  break
          else: raise SystemExit("No Twitch DJ import command found")
          PY
          source /tmp/archive.env
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "ASSET_ID=$ASSET_ID" >> "$GITHUB_ENV"
          curl -fL --retry 4 --retry-delay 2 "$ARCHIVE_URL" -o /tmp/twitch-dj-upload.zip
          curl -fL --retry 4 --retry-delay 2             "https://raw.githubusercontent.com/thebusinessflowtv/thebusinessflow/main/control-center/data/latest-dj-scan.json"             -o /tmp/latest-dj-scan.json

      - name: Audit real MP3 files, duplicates and allowed catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile,hashlib,pathlib,re,unicodedata,os,collections

          def norm(s):
              s=unicodedata.normalize("NFKD",str(s or ""))
              s="".join(c for c in s if not unicodedata.combining(c)).lower()
              s=s.replace("’","'").replace("–","-").replace("—","-")
              s=re.sub(r"\b(feat|ft|featuring)\.?\b","feat ",s)
              s=re.sub(r"[^a-z0-9]+"," ",s)
              return re.sub(r"\s+"," ",s).strip()

          def clean_title(name):
              stem=pathlib.PurePosixPath(name).name
              if stem.lower().endswith(".mp3"): stem=stem[:-4]
              stem=re.sub(r"_spotdown\.org$","",stem,flags=re.I)
              stem=re.sub(r"\s*\(SPOTISAVER\)(?:\s*\(\d+\))?$","",stem,flags=re.I)
              return stem.strip()

          scan=json.load(open("/tmp/latest-dj-scan.json"))
          allowed=scan.get("allowed") or []
          allowed_by_title=collections.defaultdict(list)
          for a in allowed: allowed_by_title[norm(a.get("title",""))].append(a)

          old=json.load(open("control/twitch-dj-supplied-2026-10-03.json"))
          old_by_title=collections.defaultdict(list)
          for a in old.get("tracks",[]): old_by_title[norm(a.get("title",""))].append(a)

          rows=[]; sha_seen={}
          with zipfile.ZipFile("/tmp/twitch-dj-upload.zip") as z:
              for info in z.infolist():
                  if info.is_dir() or not info.filename.lower().endswith(".mp3"): continue
                  base=pathlib.PurePosixPath(info.filename).name
                  # macOS AppleDouble/resource-fork files are metadata, not audio tracks.
                  if base.startswith("._") or "/__MACOSX/" in ("/"+info.filename):
                      continue
                  data=z.read(info); sha=hashlib.sha256(data).hexdigest()
                  title=clean_title(base); nt=norm(title)
                  rows.append({
                    "file":base,"title":title,"sha":sha,
                    "dup_sha":sha in sha_seen,
                    "allowed":allowed_by_title.get(nt,[]),
                    "old":old_by_title.get(nt,[])
                  })
                  sha_seen.setdefault(sha,base)

          unique=len({r["sha"] for r in rows})
          dup=sum(r["dup_sha"] for r in rows)
          allowed_rows=[r for r in rows if r["allowed"]]
          old_rows=[r for r in rows if r["old"]]
          new_allowed=[r for r in allowed_rows if not r["old"]]
          review=[r for r in rows if not r["allowed"]]

          print("=== TWITCH DJ CLEAN AUDIT ===")
          print("command_id:",os.environ.get("COMMAND_ID"))
          print("asset_id:",os.environ.get("ASSET_ID"))
          print("real_mp3_files:",len(rows))
          print("unique_audio_sha256:",unique)
          print("duplicate_audio_files:",dup)
          print("exact_title_allowed:",len(allowed_rows))
          print("already_in_previous_library_by_title:",len(old_rows))
          print("new_allowed_not_in_previous_library:",len(new_allowed))
          print("not_in_latest_allowed_scan:",len(review))
          print()
          print("=== NEW ALLOWED (not in previous 34-title library) ===")
          for r in new_allowed:
              a=r["allowed"][0]
              print(f'ALLOWED | {r["title"]} | {a.get("artists","")}')
          print()
          print("=== ALREADY PRESENT BY TITLE ===")
          for r in old_rows:
              a=r["old"][0]
              print(f'EXISTS  | {r["title"]} | {a.get("artists","")}')
          print()
          print("=== NEEDS CATALOG REVIEW / NOT IN LATEST ALLOWED ===")
          for r in review:
              print(f'REVIEW  | {r["title"]}')
          PY
