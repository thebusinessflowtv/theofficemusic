name: Sync Peter Lofi YouTube Channel

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-youtube-playlists.yml"
      - "scripts/sync_peter_lofi_youtube.py"

permissions:
  contents: write

concurrency:
  group: sync-peter-lofi-youtube
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebrand public videos and organize playlists
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: python scripts/sync_peter_lofi_youtube.py

      - name: Commit refreshed channel snapshot
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/youtube-playlists.json control/peter-lofi-channel-audit.json
          git diff --cached --quiet && { echo "Channel snapshot unchanged"; exit 0; }
          git commit -m "peter-lofi: sync public videos and playlists"
          git pull --rebase origin main
          git push origin HEAD:main
