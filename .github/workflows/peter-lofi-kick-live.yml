name: Peter Lofi — Kick Live

on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
      track_urls_b64:
        required: true
        type: string
      duration_minutes:
        description: "0 = continuous chained live"
        required: true
        default: "60"
        type: string
      title:
        required: true
        default: "Peter Lofi — Live"
        type: string
      thumbnail_url:
        required: false
        default: ""
        type: string
      loop_url:
        required: false
        default: ""
        type: string
      segment_index:
        required: true
        default: "1"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: peter-lofi-kick-${{ inputs.session_id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  KICK_STREAM_KEY: ${{ secrets.KICK_STREAM_KEY }}
  KICK_STREAM_URL: ${{ secrets.KICK_STREAM_URL }}
  KICK_RTMP_URL: ${{ secrets.KICK_RTMP_URL }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install runtime
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Validate Kick inputs
        env:
          SESSION_ID: ${{ inputs.session_id }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          SEGMENT_INDEX: ${{ inputs.segment_index }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re
          if not re.fullmatch(r'[0-9a-fA-F-]{36}',os.environ['SESSION_ID']): raise SystemExit('Invalid session_id')
          d=int(os.environ['DURATION_MINUTES']); s=int(os.environ['SEGMENT_INDEX'])
          if d < 0 or d > 10080: raise SystemExit('duration_minutes must be 0..10080')
          if s < 1: raise SystemExit('segment_index must be >=1')
          if not os.environ.get('KICK_STREAM_KEY','').strip(): raise SystemExit('Missing KICK_STREAM_KEY GitHub secret')
          PY

      - name: Decode playlist for on-demand streaming
        env:
          TRACK_URLS_B64: ${{ inputs.track_urls_b64 }}
        run: |
          set -euo pipefail
          mkdir -p build control/kick-live-results
          python - <<'PY'
          import os,base64,json,pathlib
          urls=json.loads(base64.b64decode(os.environ['TRACK_URLS_B64']).decode('utf-8'))
          if not isinstance(urls,list) or not urls: raise SystemExit('No track URLs')
          with open('build/playlist.txt','w',encoding='utf-8') as f:
              for u in urls:
                  u=str(u).replace("'","'\\''")
                  f.write("file '"+u+"'\n")
          print(f'Prepared {len(urls)} remote tracks for on-demand playback; no startup download required')
          PY

      - name: Prepare live visual
        env:
          LOOP_URL: ${{ inputs.loop_url }}
          THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
        run: |
          set -euo pipefail
          if [ -n "$THUMBNAIL_URL" ]; then curl --retry 5 --retry-all-errors -fL "$THUMBNAIL_URL" -o build/thumbnail.jpg || true; fi
          if [ ! -s build/thumbnail.jpg ]; then tr -d '\r\n ' < assets/bootstrap/thumb_compact.b64 | base64 --decode > build/thumbnail.jpg; fi
          ffmpeg -hide_banner -v error -i build/thumbnail.jpg -frames:v 1 -f null - >/dev/null

          HAVE_LOOP=0
          if [ -n "$LOOP_URL" ]; then
            if curl --retry 5 --retry-all-errors -fL "$LOOP_URL" -o build/visual-source; then
              if ffmpeg -hide_banner -v error -i build/visual-source -map 0:v:0 -t 1 -f null - >/dev/null 2>&1; then
                MIME_KIND="$(file -b --mime-type build/visual-source || true)"
                if echo "$MIME_KIND" | grep -q '^image/'; then
                  echo "Selected visual is an image; building a reusable 60 FPS video loop."
                  ffmpeg -hide_banner -loglevel warning -y -loop 1 -i build/visual-source -t 12 \
                    -vf "scale=1920:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=60,format=yuv420p" \
                    -an -c:v libx264 -preset veryfast -crf 18 -g 120 -keyint_min 120 -sc_threshold 0 build/loop.mp4
                else
                  echo "Selected visual is a video; preserving its complete duration and looping it during the stream."
                  cp build/visual-source build/loop.mp4
                fi
                HAVE_LOOP=1
              fi
            fi
          fi
          if [ "$HAVE_LOOP" = 0 ]; then
            echo "No valid custom visual was available; using the thumbnail as a fixed loop."
            ffmpeg -hide_banner -loglevel warning -y -loop 1 -i build/thumbnail.jpg -t 12 \
              -vf "scale=1920:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=60,format=yuv420p" \
              -an -c:v libx264 -preset veryfast -crf 18 -g 120 -keyint_min 120 -sc_threshold 0 build/loop.mp4
          fi
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -show_entries format=duration,size -of json build/loop.mp4

      - name: Mark Kick live starting
        env:
          SESSION_ID: ${{ inputs.session_id }}
          TITLE: ${{ inputs.title }}
          SEGMENT_INDEX: ${{ inputs.segment_index }}
        run: |
          set -euo pipefail
          git rebase --abort >/dev/null 2>&1 || true
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import datetime,json,os,pathlib
          d={'platform':'kick','status':'starting','title':os.environ['TITLE'],'session_id':os.environ['SESSION_ID'],'segment_index':int(os.environ['SEGMENT_INDEX']),'github_run_id':int(os.environ['GITHUB_RUN_ID']),'github_run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'started_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          p=pathlib.Path('control/kick-live-results')/(os.environ['SESSION_ID']+'.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_text(json.dumps(d,indent=2),encoding='utf-8')
          PY
          git add control/kick-live-results/${SESSION_ID}.json
          git commit -m "peter-lofi: Kick live starting ${SESSION_ID}" || true
          git push origin HEAD:main

      - name: Start Kick RTMPS encoder
        env:
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          set -euo pipefail
          BASE="${KICK_STREAM_URL:-${KICK_RTMP_URL:-rtmps://fa723fc1b171.global-contribute.live-video.net:443/app}}"
          TARGET="${BASE%/}/${KICK_STREAM_KEY}"
          ffmpeg -hide_banner -loglevel warning \
            -re -stream_loop -1 -i build/loop.mp4 \
            -stream_loop -1 -protocol_whitelist file,http,https,tcp,tls,crypto -f concat -safe 0 -i build/playlist.txt \
            -map 0:v:0 -map 1:a:0 \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease:flags=lanczos,pad=1920:1080:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=60,format=yuv420p" \
            -c:v libx264 -preset veryfast -tune zerolatency -profile:v high \
            -b:v 8000k -minrate 8000k -maxrate 8000k -bufsize 16000k \
            -g 120 -keyint_min 120 -sc_threshold 0 -x264-params "nal-hrd=cbr:force-cfr=1" \
            -c:a aac -b:a 160k -ar 48000 -ac 2 \
            -f flv "$TARGET" >build/ffmpeg.log 2>&1 &
          echo $! > build/ffmpeg.pid
          sleep 15
          kill -0 "$(cat build/ffmpeg.pid)" || { tail -100 build/ffmpeg.log; exit 1; }
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json,os,pathlib,datetime
          p=pathlib.Path('control/kick-live-results')/(os.environ['SESSION_ID']+'.json');d=json.loads(p.read_text());d['status']='live';d['live_at']=datetime.datetime.now(datetime.timezone.utc).isoformat();p.write_text(json.dumps(d,indent=2))
          PY
          git add control/kick-live-results/${SESSION_ID}.json
          git commit -m "peter-lofi: Kick live ${SESSION_ID}" || true
          git push origin HEAD:main

      - name: Keep Kick live running and watch stop flag
        id: keepalive
        env:
          SESSION_ID: ${{ inputs.session_id }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          PID="$(cat build/ffmpeg.pid)"; DURATION="$DURATION_MINUTES"
          if [ "$DURATION" -eq 0 ]; then SEGMENT_MIN=300; else SEGMENT_MIN="$DURATION"; [ "$SEGMENT_MIN" -gt 300 ] && SEGMENT_MIN=300; fi
          DEADLINE=$(( $(date +%s) + SEGMENT_MIN*60 )); REASON=segment_complete
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if ! kill -0 "$PID" 2>/dev/null; then tail -100 build/ffmpeg.log || true; echo "reason=encoder_failed" >> "$GITHUB_OUTPUT"; exit 1; fi
            if curl -fsS "https://raw.githubusercontent.com/thebusinessflowtv/theofficemusic/main/control/kick-live-stop/${SESSION_ID}.json" 2>/dev/null | grep -q '"stop"[[:space:]]*:[[:space:]]*true'; then REASON=manual_stop; break; fi
            sleep 30
          done
          kill -INT "$PID" 2>/dev/null || true
          for i in $(seq 1 20); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          kill -KILL "$PID" 2>/dev/null || true
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          if [ "$REASON" = segment_complete ] && { [ "$DURATION" -eq 0 ] || [ "$DURATION" -gt 300 ]; }; then echo "chain=true" >> "$GITHUB_OUTPUT"; else echo "chain=false" >> "$GITHUB_OUTPUT"; fi

      - name: Chain continuous or long Kick live
        if: steps.keepalive.outputs.chain == 'true'
        env:
          SESSION_ID: ${{ inputs.session_id }}
          TRACK_URLS_B64: ${{ inputs.track_urls_b64 }}
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          TITLE: ${{ inputs.title }}
          THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
          LOOP_URL: ${{ inputs.loop_url }}
          SEGMENT_INDEX: ${{ inputs.segment_index }}
        run: |
          set -euo pipefail
          if [ "$DURATION_MINUTES" -eq 0 ]; then REMAIN=0; else REMAIN=$((DURATION_MINUTES-300)); [ "$REMAIN" -lt 1 ] && REMAIN=1; fi
          NEXT=$((SEGMENT_INDEX+1))
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/peter-lofi-kick-live.yml/dispatches" -f ref=main -f "inputs[session_id]=${SESSION_ID}" -f "inputs[track_urls_b64]=${TRACK_URLS_B64}" -f "inputs[duration_minutes]=${REMAIN}" -f "inputs[title]=${TITLE}" -f "inputs[thumbnail_url]=${THUMBNAIL_URL}" -f "inputs[loop_url]=${LOOP_URL}" -f "inputs[segment_index]=${NEXT}"

      - name: Mark Kick live complete
        if: steps.keepalive.outputs.chain != 'true'
        env:
          SESSION_ID: ${{ inputs.session_id }}
        run: |
          set -euo pipefail
          git rebase --abort >/dev/null 2>&1 || true
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json,os,pathlib,datetime
          p=pathlib.Path('control/kick-live-results')/(os.environ['SESSION_ID']+'.json');d=json.loads(p.read_text());d['status']='completed';d['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat();p.write_text(json.dumps(d,indent=2))
          PY
          git add control/kick-live-results/${SESSION_ID}.json
          git commit -m "peter-lofi: Kick live complete ${SESSION_ID}" || true
          git push origin HEAD:main

      - name: Mark Kick live failed
        if: failure()
        env:
          SESSION_ID: ${{ inputs.session_id }}
          TITLE: ${{ inputs.title }}
        run: |
          set +e
          git rebase --abort >/dev/null 2>&1 || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p control/kick-live-results
          python - <<'PY'
          import json,os,pathlib,datetime
          p=pathlib.Path('control/kick-live-results')/(os.environ['SESSION_ID']+'.json');d={}
          try:d=json.loads(p.read_text())
          except Exception:pass
          d.update({'platform':'kick','status':'failed','title':os.environ.get('TITLE','Peter Lofi — Live'),'session_id':os.environ['SESSION_ID'],'github_run_id':int(os.environ['GITHUB_RUN_ID']),'github_run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'error_message':'Kick live workflow failed. Open github_run_url for details.','completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat()});p.write_text(json.dumps(d,indent=2))
          PY
          git add control/kick-live-results/${SESSION_ID}.json
          git commit -m "peter-lofi: Kick live failed ${SESSION_ID}" || true
          git push origin HEAD:main
