name: Peter Lofi — Kick Live

on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
      track_urls_b64:
        required: true
        type: string
      duration_minutes:
        description: "0 = continuous chained live"
        required: true
        default: "60"
        type: string
      title:
        required: true
        default: "Peter Lofi — Live"
        type: string
      description:
        required: false
        default: ""
        type: string
      thumbnail_url:
        required: false
        default: ""
        type: string
      loop_url:
        required: false
        default: ""
        type: string
      segment_index:
        required: true
        default: "1"
        type: string

permissions:
  contents: write
  actions: write

# V2: runners for consecutive segments may coexist while the successor is
# prewarmed. Only the active predecessor owns the Kick stream key until it
# writes the takeover signal.
concurrency:
  group: peter-lofi-kick-${{ inputs.session_id }}-${{ inputs.segment_index }}
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      KICK_STREAM_KEY: ${{ secrets.KICK_STREAM_KEY }}
      KICK_STREAM_URL: ${{ secrets.KICK_STREAM_URL }}
      KICK_RTMP_URL: ${{ secrets.KICK_RTMP_URL }}
      KICK_ACCESS_TOKEN: ${{ secrets.KICK_ACCESS_TOKEN }}
      KICK_CHANNEL_SLUG: peterlofi

      SESSION_ID: ${{ inputs.session_id }}
      TRACK_URLS_B64: ${{ inputs.track_urls_b64 }}
      DURATION_MINUTES: ${{ inputs.duration_minutes }}
      TITLE: ${{ inputs.title }}
      DESCRIPTION: ${{ inputs.description }}
      THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
      LOOP_URL: ${{ inputs.loop_url }}
      SEGMENT_INDEX: ${{ inputs.segment_index }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare runtime
        run: |
          set -euo pipefail
          MISSING=0
          command -v ffmpeg >/dev/null 2>&1 || MISSING=1
          command -v file >/dev/null 2>&1 || MISSING=1
          if [ "$MISSING" = 1 ]; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg file
          fi

      - name: Run prewarmed Kick live segment
        run: |
          set -euo pipefail
          python scripts/mediaforge_kick_segment_v2.py
