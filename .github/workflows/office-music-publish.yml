      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OVH_AGENT_TOKEN: ${{ secrets.OVH_AGENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
