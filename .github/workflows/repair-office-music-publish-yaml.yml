name: Repair Office Music Publish YAML

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-office-music-publish-yaml.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate env mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('.github/workflows/office-music-publish.yml')
          s=p.read_text(encoding='utf-8')
          pattern=r'(      - name: Validate inputs and secrets\n)(        env:\n(?:          [A-Z_]+: .*\n){4})(        run: \|\n)'
          fixed,n=re.subn(pattern,r'\1\3',s,count=1)
          if n!=1:
              raise SystemExit(f'Expected one duplicate env block; repaired {n}')
          p.write_text(fixed,encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/office-music-publish.yml
          git commit -m "fix: remove duplicate env mapping from publish workflow"
          git pull --rebase origin main
          git push origin HEAD:main
