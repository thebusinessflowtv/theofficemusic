name: One-off — Probe YouTube Live Health Now

on:
  push:
    paths:
      - '.github/workflows/oneoff-probe-youtube-health-now.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Probe current YouTube stream health
        run: |
          python - <<'PY'
          import json, os, pathlib, datetime
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          creds=Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube'],
          )
          creds.refresh(Request())
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)

          stations={
            'deep-house':'8cf99db8-3e53-4b74-b9d2-51fb67b54ff8',
            'rainy':'72fcb955-bbb3-41d1-b8d0-fd90427c57a5',
          }
          out={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'stations':{}}
          for name,session in stations.items():
              res=json.load(open(f'control/live-results/{session}.json',encoding='utf-8'))
              sid=res['youtube_stream_id']
              bid=res['youtube_broadcast_id']
              stream=(yt.liveStreams().list(part='status,cdn',id=sid).execute().get('items') or [None])[0]
              broadcast=(yt.liveBroadcasts().list(part='status',id=bid).execute().get('items') or [None])[0]
              st=(stream or {}).get('status') or {}
              hs=st.get('healthStatus') or {}
              ingest=((stream or {}).get('cdn') or {}).get('ingestionInfo') or {}
              out['stations'][name]={
                'broadcast_id':bid,
                'stream_id':sid,
                'stream_status':st.get('streamStatus'),
                'health_status':hs.get('status'),
                'configuration_issues':hs.get('configurationIssues') or [],
                'broadcast_lifecycle':((broadcast or {}).get('status') or {}).get('lifeCycleStatus'),
                'privacy_status':((broadcast or {}).get('status') or {}).get('privacyStatus'),
                'cdn':{
                    k:v for k,v in ((stream or {}).get('cdn') or {}).items()
                    if k != 'ingestionInfo'
                },
                'backup_ingest_configured': bool(ingest.get('backupIngestionAddress') or ingest.get('rtmpsBackupIngestionAddress')),
              }
          pathlib.Path('control/youtube-health-now.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit probe
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/youtube-health-now.json
          git commit -m "youtube: probe live health" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

