name: Retry Peter Lofi generation b26c6d09

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-b26c6d09-generation.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'retry-b26c6d09-now')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected production job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/office-music-publish.yml/dispatches \
            -f ref=main \
            -f 'inputs[job_id]=b26c6d09-bac0-4ddf-892c-b02c28f2414e' \
            -f 'inputs[duration_minutes]=60' \
            -f 'inputs[track_count]=10' \
            -f 'inputs[track_seconds]=360' \
            -f 'inputs[publish]=true' \
            -f 'inputs[privacy]=public' \
            -f 'inputs[title]=1 Hour Lofi Lounge Mix | Beats to Work, Focus & Study To | Peter Lofi 🎧' \
            -f 'inputs[loop_url]=' \
            -f 'inputs[thumbnail_url]=https://fykwalznmcrjgnyveagy.supabase.co/storage/v1/object/public/office-music-assets/thumbnail/1790744919832-d6dff46a-8414-4809-a7f2-8087050e5bec-PETER-LOFI-2.png' \
            -f 'inputs[visual_mode]=image' \
            -f 'inputs[visual_image_url]=https://fykwalznmcrjgnyveagy.supabase.co/storage/v1/object/public/office-music-assets/thumbnail/1790744919832-d6dff46a-8414-4809-a7f2-8087050e5bec-PETER-LOFI-2.png'
          echo "Corrected generation dispatched."
