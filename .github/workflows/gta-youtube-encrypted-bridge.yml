name: MediaForge — Peter Lofi Encrypted YouTube Bridge

on:
  push:
    branches: [main]
    paths:
      - 'control/gta-youtube-secure-request/*.json'

permissions:
  contents: write

concurrency:
  group: gta-youtube-encrypted-bridge
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve secure request
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_CLIENT_ID"
          test -n "$YOUTUBE_CLIENT_SECRET"
          test -n "$YOUTUBE_REFRESH_TOKEN"
          CHANGED="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" || true)"
          FILE="$(printf '%s\n' "$CHANGED" | grep -E '^control/gta-youtube-secure-request/[^/]+\.json$' | tail -1)"
          test -s "$FILE"
          jq -e '.request_id and .session_id and .public_key_pem_b64 and .title and .loop_url and .thumbnail_url' "$FILE" >/dev/null
          echo "REQUEST_FILE=$FILE" >> "$GITHUB_ENV"
          echo "REQUEST_ID=$(jq -r '.request_id' "$FILE")" >> "$GITHUB_ENV"

      - name: Install YouTube and crypto clients
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2 cryptography

      - name: Create Peter Lofi broadcast and encrypt ingest response
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,datetime as dt,json,os,pathlib,ssl,urllib.request
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          root=pathlib.Path(".")
          req=json.loads(pathlib.Path(os.environ["REQUEST_FILE"]).read_text(encoding="utf-8"))
          request_id=str(req["request_id"])
          sid=str(req["session_id"])

          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)

          channels=yt.channels().list(part="id,snippet",mine=True,maxResults=1).execute().get("items") or []
          if not channels:
              raise SystemExit("Peter Lofi OAuth returned no YouTube channel")
          channel_title=str((channels[0].get("snippet") or {}).get("title") or "")
          if "peter" not in channel_title.lower():
              raise SystemExit("Wrong YouTube OAuth channel: "+channel_title)
          print("Authenticated YouTube channel:",channel_title)

          stations_path=root/"control/youtube-stations.json"
          cfg=json.loads(stations_path.read_text(encoding="utf-8"))
          station=next((x for x in cfg.get("stations",[]) if x.get("ovh_slot")=="youtube-gta-vi"),None)
          if not station:
              raise SystemExit("youtube-gta-vi station missing")

          stream=None
          stream_id=str(station.get("youtube_stream_id") or "")
          if stream_id:
              try:
                  items=yt.liveStreams().list(part="id,snippet,cdn,status,contentDetails",id=stream_id).execute().get("items") or []
                  stream=items[0] if items else None
              except Exception:
                  stream=None
          if not stream:
              stream=yt.liveStreams().insert(
                  part="snippet,cdn,contentDetails",
                  body={
                      "snippet":{"title":"Peter Lofi — GTA VI Vice City Radio"},
                      "cdn":{"frameRate":"60fps","ingestionType":"rtmp","resolution":"1080p"},
                      "contentDetails":{"isReusable":True},
                  },
              ).execute()
              stream_id=str(stream["id"])
              station["youtube_stream_id"]=stream_id
              station["stream_provisioned_at"]=dt.datetime.now(dt.timezone.utc).isoformat()

          info=(stream.get("cdn") or {}).get("ingestionInfo") or {}
          stream_url=str(info.get("rtmpsIngestionAddress") or info.get("ingestionAddress") or "")
          stream_key=str(info.get("streamName") or "")
          if not stream_url or not stream_key:
              raise SystemExit("YouTube ingest credentials unavailable")

          now=dt.datetime.now(dt.timezone.utc)
          broadcast=yt.liveBroadcasts().insert(
              part="snippet,status,contentDetails",
              body={
                  "snippet":{
                      "title":str(req["title"])[:100],
                      "description":str(req.get("description") or "")[:5000],
                      "categoryId":"10",
                      "scheduledStartTime":(now+dt.timedelta(seconds=25)).isoformat(),
                  },
                  "status":{"privacyStatus":"public","selfDeclaredMadeForKids":False},
                  "contentDetails":{
                      "enableAutoStart":True,
                      "enableAutoStop":False,
                      "monitorStream":{"enableMonitorStream":False},
                  },
              },
          ).execute()
          bid=str(broadcast["id"])
          yt.liveBroadcasts().bind(part="id,contentDetails",id=bid,streamId=stream_id).execute()

          thumb_ok=False
          try:
              data=urllib.request.urlopen(
                  urllib.request.Request(str(req["thumbnail_url"]),headers={"User-Agent":"MediaForge-Secure-Bridge"}),
                  timeout=90,context=ssl.create_default_context()
              ).read()
              p=pathlib.Path("/tmp/gta-thumb")
              p.write_bytes(data)
              yt.thumbnails().set(videoId=bid,media_body=MediaFileUpload(str(p),resumable=False)).execute()
              thumb_ok=True
          except Exception as exc:
              print("::warning::Thumbnail upload skipped:",exc)

          secret_payload=json.dumps({
              "stream_url":stream_url,
              "stream_key":stream_key,
              "youtube_broadcast_id":bid,
              "youtube_stream_id":stream_id,
          },separators=(",",":")).encode()

          public_pem=base64.b64decode(str(req["public_key_pem_b64"]))
          public_key=serialization.load_pem_public_key(public_pem)
          aes_key=AESGCM.generate_key(bit_length=256)
          nonce=os.urandom(12)
          ciphertext=AESGCM(aes_key).encrypt(nonce,secret_payload,request_id.encode())
          encrypted_key=public_key.encrypt(
              aes_key,
              padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None)
          )

          response={
              "request_id":request_id,
              "session_id":sid,
              "status":"prepared",
              "youtube_url":f"https://www.youtube.com/watch?v={bid}",
              "youtube_broadcast_id":bid,
              "youtube_stream_id":stream_id,
              "channel_title":channel_title,
              "custom_thumbnail_applied":thumb_ok,
              "encrypted_key_b64":base64.b64encode(encrypted_key).decode(),
              "nonce_b64":base64.b64encode(nonce).decode(),
              "ciphertext_b64":base64.b64encode(ciphertext).decode(),
              "created_at":now.isoformat(),
          }
          out=root/f"control/gta-youtube-secure-response/{request_id}.json"
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(response,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          station.update({
              "runtime":"ovh",
              "status":"starting",
              "current_session_id":sid,
              "youtube_broadcast_id":bid,
              "youtube_stream_id":stream_id,
              "last_started_at":now.isoformat(),
          })
          cfg["updated_at"]=now.isoformat()
          stations_path.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("Encrypted bridge response prepared:",request_id)
          PY

      - name: Publish encrypted response only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "control/gta-youtube-secure-response/$REQUEST_ID.json" control/youtube-stations.json
          git commit -m "youtube: prepare encrypted GTA ingest $REQUEST_ID"
          for N in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((N*2))
          done
          exit 1
