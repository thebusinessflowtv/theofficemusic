name: One-off — Recover Deep House YouTube Live

on:
  push:
    paths:
      - '.github/workflows/oneoff-recover-deep-house-youtube.yml'

permissions:
  contents: write
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ secrets.GH_STREAM_CONTROL_TOKEN || github.token }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
      SOURCE_QUEUE: control/youtube-live-queue/5f54bf8e-d700-4a67-bafd-79b1dd047be5.json
      RECOVERY_SESSION_ID: 8cf99db8-3e53-4b74-b9d2-51fb67b54ff8
      OLD_BROADCAST_ID: GIOCNRogj0g
      OLD_STREAM_ID: xO4Cl7xCdcTsWkmxD_6Wfg1790820645461112

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare runtime
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v file >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg file
          fi
          python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2 cryptography

      - name: Restore exact Deep House configuration and recovery target
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          q=json.load(open(os.environ['SOURCE_QUEUE'], encoding='utf-8'))
          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          creds.refresh(Request())
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          bid=os.environ['OLD_BROADCAST_ID']; sid=os.environ['OLD_STREAM_ID']
          b=yt.liveBroadcasts().list(part='status,contentDetails',id=bid).execute().get('items') or []
          s=yt.liveStreams().list(part='status',id=sid).execute().get('items') or []
          lifecycle=((b[0].get('status') or {}).get('lifeCycleStatus') if b else None)
          stream_status=((s[0].get('status') or {}).get('streamStatus') if s else None)
          resumable=bool(b and s) and lifecycle not in {'complete','revoked'}
          print(f'DEEP_HOUSE before recovery lifecycle={lifecycle} streamStatus={stream_status} resumable={resumable}')

          values={
              'SESSION_ID': os.environ['RECOVERY_SESSION_ID'],
              'TRACK_URLS_B64': str(q['track_urls_b64']),
              'DURATION_MINUTES': '0',
              'TITLE': str(q.get('title') or 'deep house radio 💻 music to work/study/focus to | Peter Lofi 🎧'),
              'DESCRIPTION': str(q.get('description') or ''),
              'THUMBNAIL_URL': str(q.get('thumbnail_url') or ''),
              'LOOP_URL': str(q.get('loop_url') or ''),
              'RESUME_BROADCAST_ID': bid if resumable else '',
              'RESUME_STREAM_ID': sid if resumable else '',
              'SEGMENT_INDEX': '1',
              'PRIVACY_STATUS': 'public',
              'SEGMENT_SECONDS_OVERRIDE': '0',
              'PREWARM_LEAD_SECONDS': '900',
              'MAX_SEGMENTS': '0',
          }
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              for key,val in values.items():
                  if '\n' in val or '\r' in val:
                      marker=f'__MEDIAFORGE_{key}__'
                      f.write(f'{key}<<{marker}\n{val}\n{marker}\n')
                  else:
                      f.write(f'{key}={val}\n')
          print('Deep House recovery is pinned to its persisted queue video/audio configuration.')
          PY

      - name: Recover Deep House with continuity-first V7
        run: |
          set -euo pipefail
          python scripts/mediaforge_live_segment_v7.py
# retrigger 2026-10-02T01:16Z — recover Deep House after encoder termination
