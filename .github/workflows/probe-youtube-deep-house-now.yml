name: Probe YouTube Deep House Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-youtube-deep-house-now.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
      - name: Probe YouTube
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/diagnostics
          python - <<'PY'
          import json, os, pathlib, datetime
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          cfg=json.loads(pathlib.Path("control/youtube-stations.json").read_text())
          st=next(x for x in cfg["stations"] if x["key"]=="deep-house")
          bid=str(st.get("youtube_broadcast_id") or "")
          sid=str(st.get("youtube_stream_id") or "")

          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)

          b=(yt.liveBroadcasts().list(part="snippet,status,contentDetails",id=bid).execute().get("items") or [None])[0]
          s=(yt.liveStreams().list(part="status,cdn",id=sid).execute().get("items") or [None])[0]
          bs=(b or {}).get("status") or {}
          cd=(b or {}).get("contentDetails") or {}
          ss=(s or {}).get("status") or {}
          hs=ss.get("healthStatus") or {}
          out={
              "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "broadcast_id":bid,
              "stream_id":sid,
              "lifecycle":bs.get("lifeCycleStatus"),
              "privacy":bs.get("privacyStatus"),
              "stream_status":ss.get("streamStatus"),
              "health_status":hs.get("status") if isinstance(hs,dict) else hs,
              "configuration_issues":hs.get("configurationIssues",[]) if isinstance(hs,dict) else [],
              "enable_auto_start":cd.get("enableAutoStart"),
              "enable_auto_stop":cd.get("enableAutoStop"),
          }
          pathlib.Path("control/diagnostics/deep-house-now.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/diagnostics/deep-house-now.json
          git commit -m "ops: probe Deep House YouTube state" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
