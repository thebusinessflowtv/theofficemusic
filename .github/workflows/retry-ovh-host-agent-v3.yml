name: Retry OVH Host Agent Reload V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retry-ovh-host-agent-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Request unique host-agent reload
        shell: bash
        run: |
          set +e
          BASE="https://mediaforge-api.guilhermeodsgn.workers.dev"
          curl -sS -X POST "$BASE/api/ops/20261003-live-stability/host-agent?v=3&id=ops-20261003-host-agent-v3"             -H "content-type: application/json"             --data '{"id":"ops-20261003-host-agent-v3","version":3}'             -w '\nHTTP_STATUS:%{http_code}\n' > /tmp/request.txt
          sleep 15
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' "$BASE/api/ops/20261003-live-stability/status" > /tmp/status.txt
          mkdir -p control/diagnostics
          jq -n --rawfile req /tmp/request.txt --rawfile status /tmp/status.txt             '{checked_at:(now|todateiso8601),request:$req,status:$status}'             > control/diagnostics/ovh-host-agent-v3-retry.json
          cat control/diagnostics/ovh-host-agent-v3-retry.json
      - name: Persist result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/diagnostics/ovh-host-agent-v3-retry.json
          git commit -m "ops: record host-agent v3 retry" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
