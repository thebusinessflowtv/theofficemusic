name: Peter Lofi — Private Figma Live V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-ui-test-launch-v2.yml"

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE_API: "https://mediaforge-api.guilhermeodsgn.workers.dev"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load temporary media references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re
          src=pathlib.Path(".github/workflows/private-ui-test-ovh.yml").read_text(encoding="utf-8")
          keys=["BACKGROUND_URL","FIGMA_HEADER_URL","FIGMA_WEB_URL","FIGMA_ICON_URL","FONT_CARRIER_URL"]
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              for key in keys:
                  m=re.search(rf'^\s*{key}: "([^"]+)"',src,re.M)
                  if not m:
                      raise SystemExit(f"Missing temporary reference: {key}")
                  out.write(f"{key}={m.group(1)}\n")
          PY

      - name: Validate Figma runtime
        run: |
          python -m py_compile ovh-streaming/app/audio_engine.py ovh-streaming/app/visual_engine.py ovh-streaming/app/stream_core.py ovh-streaming/app/ovh_agent.py ovh-streaming/host_deploy_agent.py

      - name: Refresh OVH host agent safely
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST "$BASE_API/api/ops/20261003-live-stability/host-agent?v=4&id=ops-ui-test-host-agent-v1" | tee /tmp/host-request.json
          for I in $(seq 1 80); do
            curl -fsS "$BASE_API/api/ops/20261003-live-stability/status" > /tmp/ops-status.json
            STATUS="$(jq -r '[.commands[]? | select(.action=="deploy_host_agent")] | sort_by(.created_at) | last | .status // empty' /tmp/ops-status.json)"
            echo "deploy_host_agent=$STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && { cat /tmp/ops-status.json; exit 1; }
            sleep 3
          done
          [ "$STATUS" = "completed" ]
          sleep 8

      - name: Confirm isolated control slot is available
        shell: bash
        run: |
          set -euo pipefail
          OK=0
          for I in $(seq 1 60); do
            if curl -k -fsS https://146.59.156.224:8443/api/ovh/public-health > /tmp/pre-health.json 2>/dev/null; then
              if jq -e '.services["youtube-ui-test"]' /tmp/pre-health.json >/dev/null 2>&1; then
                jq '.services["youtube-ui-test"]' /tmp/pre-health.json
                OK=1
                break
              fi
            fi
            if curl -fsS "$BASE_API/api/ovh/public-health" > /tmp/pre-health.json 2>/dev/null; then
              if jq -e '.services["youtube-ui-test"]' /tmp/pre-health.json >/dev/null 2>&1; then
                jq '.services["youtube-ui-test"]' /tmp/pre-health.json
                OK=1
                break
              fi
            fi
            sleep 5
          done
          [ "$OK" = "1" ]

      - name: Install YouTube API client
        run: python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2

      - name: Create private broadcast and fresh OVH command
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, os, pathlib
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build

          root=pathlib.Path(".")
          now=dt.datetime.now(dt.timezone.utc)
          sid="figma-ui-test-"+now.strftime("%Y%m%d-%H%M%S")
          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)

          stream=yt.liveStreams().insert(
              part="snippet,cdn,contentDetails",
              body={
                  "snippet":{"title":"Peter Lofi — Figma UI Test Stream"},
                  "cdn":{"frameRate":"30fps","ingestionType":"rtmp","resolution":"1080p"},
                  "contentDetails":{"isReusable":False},
              },
          ).execute()
          stream_id=stream["id"]
          info=(stream.get("cdn") or {}).get("ingestionInfo") or {}
          stream_url=info.get("rtmpsIngestionAddress") or info.get("ingestionAddress")
          stream_key=info.get("streamName")
          if not stream_url or not stream_key:
              raise RuntimeError("Missing YouTube ingestion data")

          broadcast=yt.liveBroadcasts().insert(
              part="snippet,status,contentDetails",
              body={
                  "snippet":{
                      "title":"Peter Lofi — Figma Interactive Layout Test",
                      "description":"Private validation of the Peter Lofi Figma live layout, dynamic now-playing and message overlay.",
                      "categoryId":"10",
                      "scheduledStartTime":(now+dt.timedelta(seconds=20)).isoformat(),
                  },
                  "status":{"privacyStatus":"private","selfDeclaredMadeForKids":False},
                  "contentDetails":{
                      "enableAutoStart":True,
                      "enableAutoStop":False,
                      "monitorStream":{"enableMonitorStream":False},
                  },
              },
          ).execute()
          bid=broadcast["id"]
          yt.liveBroadcasts().bind(part="id,contentDetails",id=bid,streamId=stream_id).execute()

          tracks=(json.loads((root/"ovh-streaming/stations/youtube-deep-house.json").read_text(encoding="utf-8")).get("tracks") or [])
          if not tracks:
              raise RuntimeError("No tracks available for test")

          cmd_id="start-"+sid
          cmd={
              "id":cmd_id,
              "action":"start",
              "runtime_slot":"youtube-ui-test",
              "session_id":sid,
              "title":"Peter Lofi — Figma Interactive Layout Test",
              "stream_url":stream_url,
              "stream_key":stream_key,
              "loop_url":os.environ["BACKGROUND_URL"],
              "header_url":os.environ["FIGMA_HEADER_URL"],
              "web_url":os.environ["FIGMA_WEB_URL"],
              "icon_url":os.environ["FIGMA_ICON_URL"],
              "font_carrier_url":os.environ["FONT_CARRIER_URL"],
              "playlist_key":"deep-house-radio-test",
              "tracks":tracks,
              "shuffle":True,
              "repeat":True,
              "requested_at":now.isoformat(),
              "source":"figma-private-ui-test-v2",
          }
          cp=root/f"control/ovh-commands/{cmd_id}.json"
          cp.parent.mkdir(parents=True,exist_ok=True)
          cp.write_text(json.dumps(cmd,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          ip=root/"control/ovh-commands/index.json"
          idx=json.loads(ip.read_text(encoding="utf-8")) if ip.exists() else {"version":1,"commands":[]}
          items=[x for x in idx.get("commands",[]) if str(x.get("id"))!=cmd_id]
          items.append({"id":cmd_id,"path":str(cp).replace("\\","/"),"created_at":now.isoformat()})
          idx.update({"version":1,"updated_at":now.isoformat(),"commands":items[-500:]})
          ip.write_text(json.dumps(idx,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          diag={
              "status":"queued",
              "privacy_status":"private",
              "session_id":sid,
              "runtime_slot":"youtube-ui-test",
              "youtube_broadcast_id":bid,
              "youtube_stream_id":stream_id,
              "youtube_url":f"https://www.youtube.com/watch?v={bid}",
              "figma_nodes":["32:5","38:190"],
              "created_at":now.isoformat(),
          }
          dp=root/"control/diagnostics/private-ui-test.json"
          dp.parent.mkdir(parents=True,exist_ok=True)
          dp.write_text(json.dumps(diag,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as fh:
              fh.write(f"UI_SESSION_ID={sid}\n")
              fh.write(f"UI_BROADCAST_ID={bid}\n")
              fh.write(f"UI_YOUTUBE_URL=https://www.youtube.com/watch?v={bid}\n")
          print(f"Prepared private live: https://www.youtube.com/watch?v={bid}")
          PY

      - name: Publish start command
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/ovh-commands control/diagnostics/private-ui-test.json
          git commit -m "ui-test: start private Figma live v2"
          for N in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((N*2))
          done
          exit 1

      - name: Verify OVH audio video and now-playing
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for I in $(seq 1 90); do
            if curl -k -fsS https://146.59.156.224:8443/api/ovh/public-health > /tmp/ui-health.json 2>/dev/null               || curl -fsS "$BASE_API/api/ovh/public-health" > /tmp/ui-health.json 2>/dev/null; then
              STATUS="$(jq -r '.services["youtube-ui-test"].status // empty' /tmp/ui-health.json)"
              SONG="$(jq -r '.services["youtube-ui-test"].now_playing.title // .services["youtube-ui-test"].now_playing.name // empty' /tmp/ui-health.json)"
              AUDIO="$(jq -r '.services["youtube-ui-test"].audio_status // empty' /tmp/ui-health.json)"
              VISUAL="$(jq -r '.services["youtube-ui-test"].visual_status // empty' /tmp/ui-health.json)"
              echo "status=$STATUS audio=$AUDIO visual=$VISUAL now_playing=$SONG"
              if [ "$STATUS" = "live" ] && [ -n "$SONG" ] && [ "$VISUAL" = "streaming" ]; then
                READY=1
                break
              fi
            fi
            sleep 5
          done
          [ "$READY" = "1" ]
          jq '.services["youtube-ui-test"]' /tmp/ui-health.json

      - name: Verify YouTube live remains private
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          creds=Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube"],
          )
          creds.refresh(Request())
          yt=build("youtube","v3",credentials=creds,cache_discovery=False)
          bid=os.environ["UI_BROADCAST_ID"]
          final=None
          for _ in range(90):
              items=yt.liveBroadcasts().list(part="snippet,status",id=bid).execute().get("items") or []
              if not items:
                  raise RuntimeError("Broadcast disappeared")
              item=items[0]
              final={
                  "lifeCycleStatus":(item.get("status") or {}).get("lifeCycleStatus"),
                  "privacyStatus":(item.get("status") or {}).get("privacyStatus"),
                  "title":(item.get("snippet") or {}).get("title"),
              }
              print(final)
              if final["lifeCycleStatus"]=="live" and final["privacyStatus"]=="private":
                  break
              time.sleep(5)
          else:
              raise RuntimeError(f"Broadcast did not become LIVE+PRIVATE: {final}")
          pathlib=None
          with open("/tmp/youtube-status.json","w",encoding="utf-8") as fh:
              json.dump(final,fh,ensure_ascii=False,indent=2)
          PY

      - name: Persist proof and remove temporary asset workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt, json, pathlib
          p=pathlib.Path("control/diagnostics/private-ui-test.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          h=json.loads(pathlib.Path("/tmp/ui-health.json").read_text(encoding="utf-8"))
          y=json.loads(pathlib.Path("/tmp/youtube-status.json").read_text(encoding="utf-8"))
          svc=(h.get("services") or {}).get("youtube-ui-test") or {}
          d.update({
              "status":"live",
              "verified_at":dt.datetime.now(dt.timezone.utc).isoformat(),
              "youtube_status":y,
              "ovh_status":{
                  "status":svc.get("status"),
                  "fps":svc.get("fps"),
                  "video_bitrate_kbps":svc.get("video_bitrate_kbps"),
                  "audio_status":svc.get("audio_status"),
                  "visual_status":svc.get("visual_status"),
                  "now_playing":svc.get("now_playing"),
              },
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git rm -f .github/workflows/private-ui-test-ovh.yml
          git add control/diagnostics/private-ui-test.json
          git commit -m "ui-test: verify private Figma live and remove temporary asset source"
          git pull --rebase origin main
          git push origin HEAD:main
