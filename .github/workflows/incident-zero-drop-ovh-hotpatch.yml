name: Incident — Zero Drop OVH Hot Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/incident-zero-drop-ovh-hotpatch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotpatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update host deploy agent without touching RTMP
        run: |
          set -euo pipefail
          BASE="https://mediaforge-api.guilhermeodsgn.workers.dev"
          curl -fsS -X POST "$BASE/api/ops/20261003-live-stability/host-agent" | tee /tmp/host-agent.json
          for I in $(seq 1 60); do
            curl -fsS "$BASE/api/ops/20261003-live-stability/status" > /tmp/status.json
            STATUS="$(jq -r '.commands[]? | select(.id=="ops-20261003-host-agent-v2") | .status' /tmp/status.json)"
            echo "host-agent status=$STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && { cat /tmp/status.json; exit 1; }
            sleep 3
          done
          [ "$(jq -r '.commands[]? | select(.id=="ops-20261003-host-agent-v2") | .status' /tmp/status.json)" = "completed" ]

      - name: Hot patch child audio engines while preserving RTMP encoder PIDs
        run: |
          set -euo pipefail
          BASE="https://mediaforge-api.guilhermeodsgn.workers.dev"
          curl -fsS -X POST "$BASE/api/ops/20261003-live-stability/hot-patch" | tee /tmp/hot-patch.json
          for I in $(seq 1 80); do
            curl -fsS "$BASE/api/ops/20261003-live-stability/status" > /tmp/status.json
            STATUS="$(jq -r '.commands[]? | select(.id=="ops-20261003-hot-patch-v2") | .status' /tmp/status.json)"
            echo "hot-patch status=$STATUS"
            [ "$STATUS" = "completed" ] && break
            [ "$STATUS" = "failed" ] && { cat /tmp/status.json; exit 1; }
            sleep 3
          done
          [ "$(jq -r '.commands[]? | select(.id=="ops-20261003-hot-patch-v2") | .status' /tmp/status.json)" = "completed" ]

      - name: Capture proof
        run: |
          set -euo pipefail
          mkdir -p control/diagnostics
          curl -fsS "https://mediaforge-api.guilhermeodsgn.workers.dev/api/ops/20261003-live-stability/status" > /tmp/rollout.json
          curl -fsS "https://mediaforge-api.guilhermeodsgn.workers.dev/api/ovh/public-health" > /tmp/health.json
          jq -n --slurpfile rollout /tmp/rollout.json --slurpfile health /tmp/health.json             '{checked_at:(now|todateiso8601),rollout:$rollout[0],health:$health[0]}'             > control/diagnostics/ovh-zero-drop-hotpatch.json
          cat control/diagnostics/ovh-zero-drop-hotpatch.json

      - name: Persist proof
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/diagnostics/ovh-zero-drop-hotpatch.json
          git commit -m "ops: record zero-drop OVH hot patch" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
