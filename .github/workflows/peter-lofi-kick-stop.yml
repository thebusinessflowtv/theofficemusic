name: Peter Lofi — Kick Stop

on:
  workflow_dispatch:
    inputs:
      session_id:
        required: true
        type: string
  push:
    paths:
      - 'control/live-stop/*.json'
      - 'control/kick-live-stop/*.json'

permissions:
  contents: write
  actions: write

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve stop request and cancel live run
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_SESSION_ID: ${{ github.event.inputs.session_id || '' }}
        run: |
          set -euo pipefail
          SESSION_ID="${MANUAL_SESSION_ID:-}"
          if [ -z "$SESSION_ID" ]; then
            FILE="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -E '^control/(kick-)?live-stop/[^/]+\.json$' | tail -1 || true)"
            if [ -z "$FILE" ]; then
              echo "No stop request file found in this push."
              exit 0
            fi
            SESSION_ID="$(basename "$FILE" .json)"
          fi
          if ! echo "$SESSION_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::Invalid session_id"
            exit 1
          fi
          export SESSION_ID

          RESULT="control/kick-live-results/${SESSION_ID}.json"
          if [ ! -s "$RESULT" ]; then
            git fetch origin main
            git checkout origin/main -- "$RESULT" 2>/dev/null || true
          fi
          if [ ! -s "$RESULT" ]; then
            echo "No Kick result file found for ${SESSION_ID}; marking queued session as stopped."
            mkdir -p control/kick-live-results
            printf '{}\n' > "$RESULT"
          fi

          RUN_ID="$(jq -r '.github_run_id // empty' "$RESULT")"
          if [ -n "$RUN_ID" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
          fi

          git fetch origin main
          git reset --hard origin/main
          mkdir -p control/kick-live-results control/kick-live-stop
          printf '{"stop":true,"requested_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "control/kick-live-stop/${SESSION_ID}.json"
          python - <<'PY'
          import json, os, pathlib, datetime
          sid=os.environ['SESSION_ID']
          p=pathlib.Path('control/kick-live-results')/(sid+'.json')
          d={}
          try:d=json.loads(p.read_text())
          except Exception:pass
          d['platform']='kick'
          d['session_id']=sid
          d['status']='completed'
          d['stop_reason']='manual_stop'
          d['completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d,indent=2),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "control/kick-live-results/${SESSION_ID}.json" "control/kick-live-stop/${SESSION_ID}.json"
          git commit -m "peter-lofi: stop Kick live ${SESSION_ID}" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
