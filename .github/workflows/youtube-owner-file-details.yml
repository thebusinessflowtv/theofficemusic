name: YouTube Owner File Details Lookup

on:
  push:
    paths:
      - 'control/youtube-file-details-queue/*.json'

permissions:
  contents: write

env:
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve request
        id: req
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILE="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -E '^control/youtube-file-details-queue/[^/]+\.json$' | tail -1 || true)"
          test -n "$FILE"
          VID="$(jq -r '.video_id // empty' "$FILE")"
          [[ "$VID" =~ ^[A-Za-z0-9_-]{11}$ ]]
          echo "video_id=$VID" >> "$GITHUB_OUTPUT"
      - name: Install API client
        run: python -m pip install -q google-api-python-client google-auth google-auth-httplib2
      - name: Fetch owner-only details
        env:
          VIDEO_ID: ${{ steps.req.outputs.video_id }}
        run: |
          set -euo pipefail
          mkdir -p control/youtube-file-details
          python - <<'PY'
          import json, os, pathlib
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds=Credentials(token=None,refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],token_uri='https://oauth2.googleapis.com/token',client_id=os.environ['YOUTUBE_CLIENT_ID'],client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],scopes=['https://www.googleapis.com/auth/youtube'])
          yt=build('youtube','v3',credentials=creds,cache_discovery=False)
          vid=os.environ['VIDEO_ID']
          parts='snippet,status,contentDetails,fileDetails,processingDetails,suggestions'
          items=yt.videos().list(part=parts,id=vid).execute().get('items',[])
          if not items: raise SystemExit('Video not found')
          v=items[0]
          mine=yt.channels().list(part='id',mine=True).execute().get('items',[])
          cid=mine[0]['id'] if mine else None
          if v.get('snippet',{}).get('channelId') != cid: raise SystemExit('Video is not owned by authenticated channel')
          out=pathlib.Path(f'control/youtube-file-details/{vid}.json')
          out.write_text(json.dumps(v,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(v.get('fileDetails',{}),ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main
          git add control/youtube-file-details/${{ steps.req.outputs.video_id }}.json
          git commit -m "mediaforge: record YouTube owner file details ${{ steps.req.outputs.video_id }}" || exit 0
          git push origin HEAD:main
