services:
  kick:
    build: .
    container_name: peter-lofi-kick
    command: ["python", "/app/stream_core.py", "--platform", "kick"]
    restart: unless-stopped
    environment:
      STREAM_URL: ${KICK_STREAM_URL}
      STREAM_KEY: ${KICK_STREAM_KEY}
      LOOP_URL: ${LOOP_URL}
      PLAYLIST_FILE: /config/gaming.json
      VIDEO_FPS: "60"
      VIDEO_BITRATE_KBPS: "7000"
      VIDEO_BUFSIZE_KBPS: "14000"
      AUDIO_BITRATE_KBPS: "160"
      VIDEO_PROFILE: "main"
    volumes:
      - ./state:/state

  twitch:
    build: .
    container_name: peter-lofi-twitch
    command: ["python", "/app/stream_core.py", "--platform", "twitch"]
    restart: unless-stopped
    environment:
      STREAM_URL: "rtmps://live.twitch.tv:443/app"
      STREAM_KEY: ${TWITCH_STREAM_KEY}
      LOOP_URL: ${LOOP_URL}
      PLAYLIST_FILE: /config/gaming.json
      VIDEO_FPS: "30"
      VIDEO_BITRATE_KBPS: "4500"
      VIDEO_BUFSIZE_KBPS: "9000"
      AUDIO_BITRATE_KBPS: "160"
    volumes:
      - ./state:/state

  control-api:
    build: .
    container_name: peter-lofi-control-api
    command: ["python", "/app/control_api.py"]
    restart: unless-stopped
    environment:
      CONTROL_HOST: "0.0.0.0"
      CONTROL_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./state:/state
