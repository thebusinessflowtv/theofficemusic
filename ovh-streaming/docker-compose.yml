services:
  kick:
    build: .
    container_name: peter-lofi-kick
    command: ["python", "/app/stream_core.py", "--platform", "kick"]
    restart: unless-stopped
    environment:
      STREAM_URL: ${KICK_STREAM_URL}
      STREAM_KEY: ${KICK_STREAM_KEY}
      LOOP_URL: ${LOOP_URL}
      PLAYLIST_FILE: /config/gaming.json
      VIDEO_FPS: "30"
      VIDEO_BITRATE_KBPS: "5000"
      VIDEO_BUFSIZE_KBPS: "10000"
      AUDIO_BITRATE_KBPS: "160"
      VIDEO_PROFILE: "main"
      VIDEO_PRESET: "superfast"
      BOOTSTRAP_SESSION_ID: "2c2b6335-7872-4a9c-af69-cee17f10bedc"
      BOOTSTRAP_TITLE: "Peter Lofi Gaming Radio 🎮 Lofi Beats to Play, Focus & Chill 🔴 LIVE"
    volumes:
      - ./state:/state

  twitch:
    build: .
    container_name: peter-lofi-twitch
    command: ["python", "/app/stream_core.py", "--platform", "twitch"]
    restart: unless-stopped
    environment:
      STREAM_URL: "rtmps://ingest.global-contribute.live-video.net/app"
      STREAM_KEY: ${TWITCH_STREAM_KEY}
      LOOP_URL: ${LOOP_URL}
      PLAYLIST_FILE: /config/gaming.json
      VIDEO_FPS: "30"
      VIDEO_BITRATE_KBPS: "4500"
      VIDEO_BUFSIZE_KBPS: "9000"
      AUDIO_BITRATE_KBPS: "160"
      BOOTSTRAP_SESSION_ID: "b43d8f63-6e1a-4c47-a4c5-10fd2e4a5c8f"
      BOOTSTRAP_TITLE: "Peter Lofi Gaming Radio 🎮 Lofi Beats to Play, Focus & Chill 🔴 LIVE"
    volumes:
      - ./state:/state

  youtube-deep-house:
    build: .
    container_name: peter-lofi-youtube-deep-house
    command: ["python", "/app/stream_core.py", "--platform", "youtube-deep-house"]
    restart: unless-stopped
    environment:
      STREAM_URL: ${YOUTUBE_DEEP_HOUSE_STREAM_URL}
      STREAM_KEY: ${YOUTUBE_DEEP_HOUSE_STREAM_KEY}
      LOOP_URL: ${YOUTUBE_DEEP_HOUSE_LOOP_URL:-http://host.docker.internal:8790/media/a26f2e7f-4203-4788-a3ce-6d6b2052f4dc/c64b196cedad4d05977d887f1be30505023124926b4144dc935c1142fe1b4109}
      PLAYLIST_FILE: /config/youtube-deep-house.json
      VIDEO_FPS: "60"
      VIDEO_BITRATE_KBPS: "8000"
      VIDEO_BUFSIZE_KBPS: "16000"
      AUDIO_BITRATE_KBPS: "192"
      VIDEO_PROFILE: "main"
      VIDEO_PRESET: "superfast"
      VIDEO_COPY_MODE: "1"
      BOOTSTRAP_SESSION_ID: "8cf99db8-3e53-4b74-b9d2-51fb67b54ff8"
      BOOTSTRAP_TITLE: "deep house radio 💻 music to work/study/focus to | Peter Lofi 🎧"
    volumes:
      - ./state:/state

  youtube-rainy:
    build: .
    container_name: peter-lofi-youtube-rainy
    command: ["python", "/app/stream_core.py", "--platform", "youtube-rainy"]
    restart: unless-stopped
    environment:
      STREAM_URL: ${YOUTUBE_RAINY_STREAM_URL}
      STREAM_KEY: ${YOUTUBE_RAINY_STREAM_KEY}
      LOOP_URL: ${YOUTUBE_RAINY_LOOP_URL:-http://host.docker.internal:8790/media/998ca654-bb42-4c35-99c6-04ac2ebad84c/b6bf0c5819a04630b36f61314ed6de7566e4b48b72df41c59093a5bd7c0f9ab0}
      PLAYLIST_FILE: /config/youtube-rainy.json
      VIDEO_FPS: "60"
      VIDEO_BITRATE_KBPS: "8000"
      VIDEO_BUFSIZE_KBPS: "16000"
      AUDIO_BITRATE_KBPS: "192"
      VIDEO_PROFILE: "main"
      VIDEO_PRESET: "superfast"
      VIDEO_COPY_MODE: "1"
      BOOTSTRAP_SESSION_ID: "72fcb955-bbb3-41d1-b8d0-fd90427c57a5"
      BOOTSTRAP_TITLE: "rainy lofi radio 🌧️ beats to study/work/relax to | Peter Lofi 🎧"
    volumes:
      - ./state:/state

  control-api:
    build: .
    container_name: peter-lofi-control-api
    command: ["python", "/app/control_api.py"]
    restart: unless-stopped
    environment:
      CONTROL_HOST: "0.0.0.0"
      CONTROL_PORT: "8787"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./state:/state

  ovh-agent:
    build: .
    container_name: peter-lofi-ovh-agent
    command: ["python", "/app/ovh_agent.py"]
    restart: unless-stopped
    network_mode: host
    environment:
      MEDIAFORGE_API_URL: ${MEDIAFORGE_API_URL:-http://127.0.0.1:8790}
      MEDIAFORGE_AGENT_TOKEN: ${MEDIAFORGE_AGENT_TOKEN:-}
      OVH_AGENT_POLL_SECONDS: "5"
      OVH_LOCAL_STATUS_SECONDS: "10"
      OVH_REMOTE_STATUS_SECONDS: "10"
    volumes:
      - ./state:/state
